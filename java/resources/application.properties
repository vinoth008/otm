# Smart Transaction Control with Expense Tracker
# Java Business Logic Module Configuration

# Application
app.name=Smart Transaction Control with Expense Tracker
app.version=1.0.0
app.timezone=Asia/Kolkata

# MongoDB Connection (used by PHP backend; Java module is standalone business logic)
mongodb.uri=mongodb://localhost:27017
mongodb.database=expense_tracker

# Logging
logging.level.root=INFO
logging.level.com.expensetracker=DEBUG

# Report settings
report.default-currency=INR
report.date-format=yyyy-MM-dd HH:mm