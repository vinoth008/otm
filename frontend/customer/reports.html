<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="../assets/css/auth.css" rel="stylesheet">
  <style>
    .dash-body { background: linear-gradient(135deg, #0f172a, #111827); min-height: 100vh; color: #fff; }
    .glass { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(16px); border-radius: 20px; }
    .table-darkish { color: #e5e7eb; }
    .table-darkish td, .table-darkish th { border-color: rgba(255,255,255,0.08) !important; }
    .form-control, .form-select { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; }
    .form-control:focus, .form-select:focus { background: rgba(255,255,255,0.12); color: #fff; border-color: #f59e0b; box-shadow: none; }
    .form-control::placeholder { color: #94a3b8; }
    .form-select option { background: #1e293b; color: #fff; }
    @media print {
      body { background: #fff !important; color: #000 !important; }
      .glass { background: #fff !important; border: 1px solid #ddd !important; backdrop-filter: none !important; color: #000 !important; }
      .no-print { display: none !important; }
      .table-darkish, .table-darkish td, .table-darkish th { color: #000 !important; border-color: #ddd !important; }
      .text-secondary, .text-success, .text-danger { color: #000 !important; }
      canvas { max-height: 260px; }
    }
  </style>
  <link href="../css/app_theme.css" rel="stylesheet">
</head>
<body class="dash-body">
  <nav class="navbar navbar-dark border-bottom border-light border-opacity-10 px-4 no-print">
    <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fa-solid fa-chart-pie me-2"></i>Reports</a>
    <div class="ms-auto d-flex align-items-center gap-2">
      <a href="dashboard.html" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
    </div>
  </nav>

  <main class="container-fluid p-4">
    <div class="row g-4 mb-4">
      <div class="col-md-3">
        <div class="glass p-3">
          <div class="text-secondary">Total Income</div>
          <h3 class="mb-0" id="repIncome">₹ 0</h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="glass p-3">
          <div class="text-secondary">Total Expense</div>
          <h3 class="mb-0" id="repExpense">₹ 0</h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="glass p-3">
          <div class="text-secondary">Net</div>
          <h3 class="mb-0" id="repNet">₹ 0</h3>
        </div>
      </div>
      <div class="col-md-3">
        <div class="glass p-3">
          <div class="text-secondary">Savings Rate</div>
          <h3 class="mb-0" id="repSavings">0%</h3>
        </div>
      </div>
    </div>

    <div class="glass p-4 mb-4 no-print">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label">Period</label>
          <select class="form-select" id="periodSelect">
            <option value="month">Monthly</option>
            <option value="year">Yearly</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Year</label>
          <select class="form-select" id="yearSelect"></select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Month</label>
          <select class="form-select" id="monthSelect">
            <option value="01">January</option><option value="02">February</option>
            <option value="03">March</option><option value="04">April</option>
            <option value="05">May</option><option value="06">June</option>
            <option value="07">July</option><option value="08">August</option>
            <option value="09">September</option><option value="10">October</option>
            <option value="11">November</option><option value="12">December</option>
          </select>
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button class="btn btn-warning flex-fill" id="generateBtn"><i class="fa-solid fa-wand-magic-sparkles me-1"></i>Generate</button>
          <button class="btn btn-outline-light" onclick="printReport()" title="Print"><i class="fa-solid fa-print"></i></button>
          <button class="btn btn-outline-light" id="csvBtn" title="Download CSV"><i class="fa-solid fa-file-csv"></i></button>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="glass p-4">
          <h5 class="mb-3">Income vs Expense</h5>
          <canvas id="reportBarChart" height="240"></canvas>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="glass p-4">
          <h5 class="mb-3">Spending by Category</h5>
          <canvas id="reportPieChart" height="240"></canvas>
        </div>
      </div>
    </div>

    <div class="glass p-4 mt-4">
      <h5 class="mb-3">Transaction Details</h5>
      <div class="table-responsive">
        <table class="table table-darkish align-middle mb-0">
          <thead>
            <tr>
              <th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th>
            </tr>
          </thead>
          <tbody id="reportTableBody">
            <tr><td colspan="5" class="text-center text-secondary">Select a period and click Generate.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    const fmtINR = n => '₹ ' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    let barChart, pieChart;

    function populateYears() {
      const sel = document.getElementById('yearSelect');
      const y = new Date().getFullYear();
      for (let i = y; i >= y - 5; i--) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i;
        if (i === y) opt.selected = true;
        sel.appendChild(opt);
      }
    }

    async function loadReport() {
      const period = document.getElementById('periodSelect').value;
      const year = document.getElementById('yearSelect').value;
      const month = document.getElementById('monthSelect').value;
      const isMonth = period === 'month';
      try {
        const [summaryRes, categoryRes, txRes] = await Promise.all([
          apiGet(`?module=reports&action=${isMonth ? 'monthly_summary' : 'yearly_summary'}&year=${year}&month=${month}`),
          apiGet(`?module=reports&action=category_breakdown&type=expense&period=${isMonth ? 'month' : 'year'}`),
          apiGet(`?module=transactions&action=report&date_from=${isMonth ? year + '-' + month + '-01' : year + '-01-01'}&date_to=${isMonth ? year + '-' + month + '-31' : year + '-12-31'}`)
        ]);
        const s = summaryRes.data;
        document.getElementById('repIncome').textContent = fmtINR(s.total_income);
        document.getElementById('repExpense').textContent = fmtINR(s.total_expense);
        document.getElementById('repNet').textContent = fmtINR(s.net);
        document.getElementById('repSavings').textContent = (s.total_income > 0 ? Math.round(((s.total_income - s.total_expense) / s.total_income) * 100) : 0) + '%';
        renderBarChart(s, isMonth);
        renderPieChart(categoryRes.data.categories || []);
        renderTable(txRes.data.transactions || []);
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to load report' });
      }
    }

    function renderBarChart(s, isMonth) {
      let labels, income, expense;
      if (isMonth) {
        const daily = s.daily || [];
        labels = daily.map(d => d._id);
        income = daily.map(d => d.income || 0);
        expense = daily.map(d => d.expense || 0);
      } else {
        labels = (s.months || []).map(m => new Date(0, m.month - 1).toLocaleString('en', { month: 'short' }));
        income = (s.months || []).map(m => m.income || 0);
        expense = (s.months || []).map(m => m.expense || 0);
      }
      if (barChart) barChart.destroy();
      barChart = new Chart(document.getElementById('reportBarChart'), {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'Income', data: income, backgroundColor: '#22c55e' },
            { label: 'Expense', data: expense, backgroundColor: '#ef4444' }
          ]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#fff' } } },
          scales: {
            x: { ticks: { color: '#cbd5e1' }, grid: { color: 'rgba(255,255,255,0.08)' } },
            y: { ticks: { color: '#cbd5e1' }, grid: { color: 'rgba(255,255,255,0.08)' } }
          }
        }
      });
    }

    function renderPieChart(cats) {
      const labels = cats.map(c => c._id);
      const data = cats.map(c => c.total);
      const palette = ['#f97316','#3b82f6','#ef4444','#ec4899','#22c55e','#a855f7','#14b8a6','#eab308','#6366f1','#84cc16'];
      if (pieChart) pieChart.destroy();
      pieChart = new Chart(document.getElementById('reportPieChart'), {
        type: 'pie',
        data: {
          labels: labels.length ? labels : ['No data'],
          datasets: [{ data: data.length ? data : [1], backgroundColor: labels.map((_, i) => palette[i % palette.length]) }]
        },
        options: { responsive: true, plugins: { legend: { labels: { color: '#fff' } } } }
      });
    }

    function renderTable(list) {
      const tb = document.getElementById('reportTableBody');
      if (!list.length) {
        tb.innerHTML = '<tr><td colspan="5" class="text-center text-secondary">No transactions in this period.</td></tr>';
        return;
      }
      const typeBadge = t => t.type === 'income' ? 'text-bg-success' : t.type === 'expense' ? 'text-bg-danger' : 'text-bg-info';
      const sign = t => t.type === 'expense' ? '-' : '+';
      const color = t => t.type === 'expense' ? 'text-danger' : 'text-success';
      tb.innerHTML = list.map(t => `<tr>
        <td>${t.date}</td>
        <td><span class="badge ${typeBadge(t)}">${t.type.charAt(0).toUpperCase() + t.type.slice(1)}</span></td>
        <td>${t.category}</td>
        <td>${t.description || '-'}</td>
        <td class="${color(t)}">${sign(t)}${fmtINR(t.amount)}</td>
      </tr>`).join('');
    }

    function printReport() {
      if (document.getElementById('reportTableBody').querySelector('td') === null) { loadReport(); }
      window.print();
    }

    async function downloadCSV() {
      const period = document.getElementById('periodSelect').value;
      const year = document.getElementById('yearSelect').value;
      const month = document.getElementById('monthSelect').value;
      const isMonth = period === 'month';
      try {
        const res = await apiGet(`?module=transactions&action=report&date_from=${isMonth ? year + '-' + month + '-01' : year + '-01-01'}&date_to=${isMonth ? year + '-' + month + '-31' : year + '-12-31'}`);
        const rows = res.data.transactions;
        if (!rows.length) { Swal.fire({ icon: 'info', title: 'No data', text: 'No transactions to export.' }); return; }
        const header = ['Date','Type','Category','Description','Amount'];
        const csv = [header.join(',')].concat(rows.map(t => [
          t.date, t.type, `"${t.category}"`, `"${(t.description || '').replace(/"/g, '""')}"`, t.amount
        ].join(','))).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `report_${period}_${year}_${isMonth ? month : 'year'}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Export failed' });
      }
    }

    document.getElementById('generateBtn').addEventListener('click', loadReport);
    document.getElementById('csvBtn').addEventListener('click', downloadCSV);
    document.getElementById('periodSelect').addEventListener('change', () => {
      document.getElementById('monthSelect').disabled = document.getElementById('periodSelect').value !== 'month';
    });

    document.addEventListener('DOMContentLoaded', () => {
      populateYears();
      loadReport();
    });
  </script>
  <script src="../js/app_theme.js"></script>
</body>
</html>
