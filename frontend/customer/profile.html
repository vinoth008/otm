<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/css/auth.css" rel="stylesheet">
  <style>
    .dash-body { background: linear-gradient(135deg, #0f172a, #111827); min-height: 100vh; color: #fff; }
    .glass { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(16px); border-radius: 20px; }
    .avatar-box { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #2563eb, #8b5cf6); display: grid; place-items: center; font-size: 3rem; overflow: hidden; }
    .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
    .form-control, .form-select { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; }
    .form-control:focus, .form-select:focus { background: rgba(255,255,255,0.12); color: #fff; border-color: #f59e0b; box-shadow: none; }
    .form-control::placeholder { color: #94a3b8; }
    .form-select option { background: #1e293b; color: #fff; }
  </style>
  <link href="../css/app_theme.css" rel="stylesheet">
</head>
<body class="dash-body">
  <nav class="navbar navbar-dark border-bottom border-light border-opacity-10 px-4">
    <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fa-solid fa-user-gear me-2"></i>Profile Settings</a>
    <div class="ms-auto">
      <a href="dashboard.html" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
    </div>
  </nav>

  <main class="container-fluid p-4">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="glass p-4 text-center h-100">
          <div class="avatar-box mx-auto mb-3" id="avatarBox"><i class="fa-solid fa-user"></i></div>
          <h4 class="mb-1" id="displayName">Loading...</h4>
          <p class="text-secondary mb-2" id="displayEmail">Loading...</p>
          <span class="badge text-bg-success mb-3">Email Verified</span>
          <div class="d-grid gap-2">
            <label class="btn btn-outline-light" for="photoInput">Upload Photo</label>
            <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" class="d-none">
            <button class="btn btn-outline-light" onclick="openChangePassword()">Change Password</button>
            <button class="btn btn-outline-danger" onclick="deactivateAccount()">Deactivate Account</button>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="glass p-4">
          <h5 class="mb-4">Edit Profile</h5>
          <form id="profileForm" class="row g-3">
            <div class="col-md-6">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" id="first_name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" id="last_name">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="email" disabled>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" class="form-control" id="phone">
            </div>
            <div class="col-md-6">
              <label class="form-label">Role</label>
              <input type="text" class="form-control" id="role" disabled>
            </div>
            <div class="col-md-6">
              <label class="form-label">Member Since</label>
              <input type="text" class="form-control" id="created_at" disabled>
            </div>
            <div class="col-12">
              <button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk me-2"></i>Save Profile</button>
              <button class="btn btn-outline-light ms-2" type="reset">Reset</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    async function loadProfile() {
      try {
        const res = await apiGet('?module=profile&action=get');
        const u = res.data;
        document.getElementById('first_name').value = u.first_name || '';
        document.getElementById('last_name').value = u.last_name || '';
        document.getElementById('email').value = u.email || '';
        document.getElementById('phone').value = u.phone || '';
        document.getElementById('role').value = u.role || '';
        document.getElementById('created_at').value = u.created_at || '';
        document.getElementById('displayName').textContent = (u.first_name || '') + ' ' + (u.last_name || '');
        document.getElementById('displayEmail').textContent = u.email || '';
        if (u.profile_photo) {
          document.getElementById('avatarBox').innerHTML = `<img src="../../uploads/profile_photos/${u.profile_photo}" alt="Profile">`;
        }
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to load profile' });
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await apiPost('?module=profile&action=update', {
          first_name: document.getElementById('first_name').value.trim(),
          last_name: document.getElementById('last_name').value.trim(),
          phone: document.getElementById('phone').value.trim()
        });
        Swal.fire({ icon: 'success', title: 'Profile Updated', text: res.message || 'Profile saved successfully.' });
        loadProfile();
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to update profile' });
      }
    });

    document.getElementById('photoInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('photo', file);
      try {
        const res = await apiUpload('?module=profile&action=upload_photo', fd);
        Swal.fire({ icon: 'success', title: 'Photo Updated', text: res.message || 'Profile photo updated.' });
        loadProfile();
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to upload photo' });
      }
    });

    function openChangePassword() {
      Swal.fire({
        title: 'Change Password',
        html: `
          <input type="password" id="swal-current" class="swal2-input" placeholder="Current Password">
          <input type="password" id="swal-new" class="swal2-input" placeholder="New Password (min 8 chars)">
          <input type="password" id="swal-confirm" class="swal2-input" placeholder="Confirm New Password">
        `,
        showCancelButton: true,
        confirmButtonText: 'Change Password',
        preConfirm: async () => {
          const current = document.getElementById('swal-current').value;
          const newPass = document.getElementById('swal-new').value;
          const confirm = document.getElementById('swal-confirm').value;
          if (!current || !newPass || !confirm) {
            Swal.showValidationMessage('All fields are required');
            return false;
          }
          if (newPass !== confirm) {
            Swal.showValidationMessage('New passwords do not match');
            return false;
          }
          try {
            const res = await apiPost('?module=profile&action=change_password', {
              current_password: current,
              new_password: newPass,
              confirm_password: confirm
            });
            return res;
          } catch (err) {
            Swal.showValidationMessage(err.message || 'Failed to change password');
            return false;
          }
        }
      }).then(result => {
        if (result.isConfirmed) {
          Swal.fire({ icon: 'success', title: 'Password Changed', text: result.value.message || 'Password changed successfully.' });
        }
      });
    }

    function deactivateAccount() {
      Swal.fire({
        icon: 'warning',
        title: 'Deactivate Account',
        text: 'This action is not available. Please contact support for account deactivation.',
        confirmButtonText: 'OK'
      });
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
  <script src="../js/app_theme.js"></script>
</body>
</html>
