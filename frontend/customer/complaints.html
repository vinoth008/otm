<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaints | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/css/auth.css" rel="stylesheet">
  <style>
    .dash-body { background: linear-gradient(135deg, #0f172a, #111827); min-height: 100vh; color: #fff; }
    .glass { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(16px); border-radius: 20px; }
    .form-control, .form-select { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; }
    .form-control:focus, .form-select:focus { background: rgba(255,255,255,0.12); color: #fff; border-color: #f59e0b; box-shadow: none; }
    .form-select option { background: #1e293b; color: #fff; }
  </style>
  <link href="../css/app_theme.css" rel="stylesheet">
</head>
<body class="dash-body">
  <nav class="navbar navbar-dark border-bottom border-light border-opacity-10 px-4">
    <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fa-solid fa-headset me-2"></i>Complaints</a>
    <div class="ms-auto">
      <a href="dashboard.html" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
    </div>
  </nav>

  <main class="container-fluid p-4">
    <div class="row g-4 mb-4">
      <div class="col-md-3"><div class="glass p-3"><div class="text-secondary">Open Tickets</div><h3 class="mb-0" id="statOpen">0</h3></div></div>
      <div class="col-md-3"><div class="glass p-3"><div class="text-secondary">In Progress</div><h3 class="mb-0" id="statProgress">0</h3></div></div>
      <div class="col-md-3"><div class="glass p-3"><div class="text-secondary">Resolved</div><h3 class="mb-0" id="statResolved">0</h3></div></div>
      <div class="col-md-3"><div class="glass p-3"><div class="text-secondary">Total Tickets</div><h3 class="mb-0" id="statTotal">0</h3></div></div>
    </div>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="glass p-4 h-100">
          <h5 class="mb-3">Raise Complaint</h5>
          <form id="complaintForm" class="row g-3">
            <div class="col-12">
              <label class="form-label">Subject</label>
              <input type="text" class="form-control" id="subject" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Category</label>
              <select class="form-select" id="category" required>
                <option value="">Select</option>
                <option value="TRANSACTION">Transaction Issue</option>
                <option value="LOGIN">Login Issue</option>
                <option value="TRANSFER">Transfer Issue</option>
                <option value="WALLET">Wallet Issue</option>
                <option value="PROFILE">Profile Issue</option>
                <option value="OTHER">Other</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Priority</label>
              <select class="form-select" id="priority">
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
                <option>Urgent</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Complaint Details</label>
              <textarea class="form-control" id="details" rows="6" required></textarea>
            </div>
            <div class="col-12">
              <button class="btn btn-warning w-100" type="submit">
                <i class="fa-solid fa-paper-plane me-2"></i>Submit Ticket
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="glass p-4">
          <ul class="nav nav-tabs mb-4" id="complaintTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#all" type="button">All</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#open" type="button">Open</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" data-bs-toggle="tab" data-bs-target="#resolved" type="button">Resolved</button>
            </li>
          </ul>

          <div class="tab-content">
            <div class="tab-pane fade show active" id="all">
              <div id="allList"></div>
            </div>
            <div class="tab-pane fade" id="open">
              <div id="openList"></div>
            </div>
            <div class="tab-pane fade" id="resolved">
              <div id="resolvedList"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    let allComplaints = [];

    function badgeFor(status) {
      const map = { 'Open': 'text-bg-warning', 'In Progress': 'text-bg-info', 'Resolved': 'text-bg-success', 'Closed': 'text-bg-secondary' };
      return `<span class="badge ${map[status] || 'text-bg-secondary'}">${status}</span>`;
    }

    function renderList(containerId, items) {
      const container = document.getElementById(containerId);
      if (!items.length) {
        container.innerHTML = '<p class="text-secondary">No complaints found.</p>';
        return;
      }
      container.innerHTML = items.map(c => `
        <div class="glass p-3 mb-3">
          <div class="d-flex justify-content-between">
            <div>
              <h6 class="mb-1">${c.subject}</h6>
              <small class="text-secondary">Ticket #${c.ticket_no} • ${c.priority} priority • ${c.created_at}</small>
            </div>
            ${badgeFor(c.status)}
          </div>
          <p class="mb-2 mt-2 text-secondary">${c.description}</p>
          ${c.staff_reply ? `<div class="border-top pt-2 mt-2"><small class="text-info"><i class="fa-solid fa-reply me-1"></i>${c.staff_reply}</small></div>` : ''}
          <button class="btn btn-sm btn-outline-light mt-2" onclick="viewTicket('${c._id}')">View</button>
        </div>
      `).join('');
    }

    async function loadComplaints() {
      try {
        const res = await apiGet('?module=complaints&action=get_mine&limit=100');
        allComplaints = res.data.complaints || [];
        renderList('allList', allComplaints);
        renderList('openList', allComplaints.filter(c => c.status === 'Open' || c.status === 'In Progress'));
        renderList('resolvedList', allComplaints.filter(c => c.status === 'Resolved' || c.status === 'Closed'));
        document.getElementById('statOpen').textContent = allComplaints.filter(c => c.status === 'Open').length;
        document.getElementById('statProgress').textContent = allComplaints.filter(c => c.status === 'In Progress').length;
        document.getElementById('statResolved').textContent = allComplaints.filter(c => c.status === 'Resolved' || c.status === 'Closed').length;
        document.getElementById('statTotal').textContent = allComplaints.length;
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to load complaints' });
      }
    }

    document.getElementById('complaintForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await apiPost('?module=complaints&action=create', {
          subject: document.getElementById('subject').value,
          category: document.getElementById('category').value,
          priority: document.getElementById('priority').value,
          description: document.getElementById('details').value
        });
        Swal.fire({ icon: 'success', title: 'Ticket Submitted', text: res.message || 'Your complaint has been recorded.' });
        e.target.reset();
        loadComplaints();
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to submit complaint' });
      }
    });

    function viewTicket(id) {
      const c = allComplaints.find(x => x._id === id);
      if (!c) return;
      Swal.fire({
        icon: 'info',
        title: `Ticket ${c.ticket_no}`,
        html: `<b>Status:</b> ${c.status}<br><b>Priority:</b> ${c.priority}<br><b>Category:</b> ${c.category}<br><br>${c.description}${c.staff_reply ? `<hr><b>Staff Reply:</b><br>${c.staff_reply}` : ''}`
      });
    }

    document.addEventListener('DOMContentLoaded', loadComplaints);
  </script>
  <script src="../js/app_theme.js"></script>
</body>
</html>
