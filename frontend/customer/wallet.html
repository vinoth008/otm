<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="../assets/css/auth.css" rel="stylesheet">
  <style>
    .dash-body { background: linear-gradient(135deg, #0f172a, #111827); min-height: 100vh; color: #fff; }
    .glass { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(16px); border-radius: 20px; }
    .wallet-balance { font-size: 2.2rem; font-weight: 700; }
    .qr-box { width: 220px; height: 220px; background: #fff; border-radius: 16px; display: grid; place-items: center; margin: 0 auto; color: #111827; }
  </style>
  <link href="../css/app_theme.css" rel="stylesheet">
</head>
<body class="dash-body">
  <nav class="navbar navbar-dark border-bottom border-light border-opacity-10 px-4">
    <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fa-solid fa-wallet me-2"></i>Digital Wallet</a>
    <div class="ms-auto">
      <a href="dashboard.html" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
    </div>
  </nav>

  <main class="container-fluid p-4">
    <div class="row g-4 mb-4">
      <div class="col-lg-8">
        <div class="glass p-4 h-100">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
              <div class="text-secondary">Available Wallet Balance</div>
              <div class="wallet-balance" id="walletBalance">₹ 0.00</div>
              <p class="text-secondary mb-0" id="upiId">UPI ID: user@bankwallet</p>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-success" onclick="walletAction('Add Money')"><i class="fa-solid fa-circle-plus me-1"></i>Add</button>
              <button class="btn btn-primary" onclick="walletAction('Send Money')"><i class="fa-solid fa-paper-plane me-1"></i>Send</button>
              <button class="btn btn-warning" onclick="walletAction('Request Money')"><i class="fa-solid fa-hand-holding-dollar me-1"></i>Request</button>
            </div>
          </div>

          <div class="row g-3 mt-4">
            <div class="col-md-4">
              <div class="glass p-3">
                <div class="text-secondary">Today Spent</div>
                <h4 class="mb-0" id="todaySpent">₹ 0</h4>
              </div>
            </div>
            <div class="col-md-4">
              <div class="glass p-3">
                <div class="text-secondary">Today Received</div>
                <h4 class="mb-0" id="todayReceived">₹ 0</h4>
              </div>
            </div>
            <div class="col-md-4">
              <div class="glass p-3">
                <div class="text-secondary">Monthly Cashflow</div>
                <h4 class="mb-0" id="monthlyCashflow">₹ 0</h4>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="glass p-4 h-100 text-center">
          <h5 class="mb-3">Scan QR</h5>
          <div class="qr-box mb-3">
            <div>
              <i class="fa-solid fa-qrcode fa-4x mb-2"></i>
              <div class="small">QR Payment</div>
            </div>
          </div>
          <button class="btn btn-outline-light" onclick="walletAction('Open QR Scanner')">
            <i class="fa-solid fa-camera me-1"></i>Scan QR Code
          </button>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-lg-6">
        <div class="glass p-4 h-100">
          <h5 class="mb-3">Wallet Distribution</h5>
          <canvas id="walletChart" height="220"></canvas>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="glass p-4 h-100">
          <h5 class="mb-3">Recent Wallet Activity</h5>
          <div class="table-responsive">
            <table class="table table-dark align-middle mb-0">
              <thead>
                <tr>
                  <th>Type</th>
                  <th>Party</th>
                  <th>Amount</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="walletActivity">
                <tr><td colspan="4" class="text-center text-secondary">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="glass p-4">
      <h5 class="mb-3">Wallet Tools</h5>
      <div class="row g-3">
        <div class="col-md-3"><button class="btn btn-outline-light w-100" onclick="downloadStatement()">Download Statement</button></div>
        <div class="col-md-3"><button class="btn btn-outline-light w-100" onclick="printReceipt()">Print Receipt</button></div>
        <div class="col-md-3"><button class="btn btn-outline-light w-100" onclick="walletAction('Manage Beneficiaries')">Beneficiaries</button></div>
        <div class="col-md-3"><button class="btn btn-outline-light w-100" onclick="walletAction('Wallet Settings')">Settings</button></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    let walletChart = null;

    function fmtINR(amount) {
      return '₹ ' + Number(amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function statusBadge(status) {
      const map = { 'COMPLETED': 'success', 'SUCCESS': 'success', 'PENDING': 'warning', 'FAILED': 'danger', 'FAIL': 'danger' };
      return `<span class="badge text-bg-${map[status] || 'secondary'}">${status || 'Unknown'}</span>`;
    }

    async function loadWallet() {
      try {
        const res = await apiGet('?module=dashboard&action=summary');
        const d = res.data || {};
        const balance = d.balance || d.total_balance || 0;
        document.getElementById('walletBalance').textContent = fmtINR(balance);
        document.getElementById('todaySpent').textContent = fmtINR(d.today_expense || d.today_spent || 0);
        document.getElementById('todayReceived').textContent = fmtINR(d.today_income || d.today_received || 0);
        document.getElementById('monthlyCashflow').textContent = fmtINR(d.monthly_income || d.monthly_cashflow || 0);
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        if (user.email) document.getElementById('upiId').textContent = 'UPI ID: ' + user.email.split('@')[0] + '@bankwallet';

        const spent = d.total_expense || d.monthly_expense || 0;
        const received = d.total_income || d.monthly_income || 0;
        const locked = Math.max(0, (balance * 0.1));
        if (walletChart) walletChart.destroy();
        walletChart = new Chart(document.getElementById('walletChart'), {
          type: 'doughnut',
          data: {
            labels: ['Available', 'Locked', 'Spent'],
            datasets: [{
              data: [Math.max(0, balance - locked), locked, spent],
              backgroundColor: ['#22c55e', '#f59e0b', '#3b82f6']
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { labels: { color: '#fff' } } }
          }
        });
      } catch (err) {
        document.getElementById('walletBalance').textContent = '₹ 0.00';
      }
    }

    async function loadActivity() {
      try {
        const res = await apiGet('?module=transactions&action=get_all&limit=10');
        const txns = res.data.transactions || res.data || [];
        const tbody = document.getElementById('walletActivity');
        if (!txns.length) {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center text-secondary">No transactions yet</td></tr>';
        } else {
          tbody.innerHTML = txns.map(t => `
            <tr>
              <td>${t.type || t.transaction_type || 'N/A'}</td>
              <td>${t.party || t.counterparty || t.description || 'N/A'}</td>
              <td>${fmtINR(t.amount)}</td>
              <td>${statusBadge(t.status)}</td>
            </tr>`).join('');
        }
      } catch (err) {
        document.getElementById('walletActivity').innerHTML = '<tr><td colspan="4" class="text-center text-secondary">Failed to load activity</td></tr>';
      }
    }

    function walletAction(name) {
      Swal.fire({ icon: 'info', title: name, text: `${name} feature is available in the Transactions page.` });
    }

    function downloadStatement() {
      window.open('transactions.html', '_blank');
    }

    function printReceipt() {
      window.print();
    }

    document.addEventListener('DOMContentLoaded', () => { loadWallet(); loadActivity(); });
  </script>
  <script src="../js/app_theme.js"></script>
</body>
</html>
