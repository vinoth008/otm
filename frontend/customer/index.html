<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Home | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/css/auth.css" rel="stylesheet">
  <style>
    .dash-body { background: linear-gradient(135deg, #0f172a, #111827); min-height: 100vh; color: #fff; }
    .glass { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(16px); border-radius: 20px; }
  </style>
  <link href="../css/app_theme.css" rel="stylesheet">
</head>
<body class="dash-body">
  <nav class="navbar navbar-dark border-bottom border-light border-opacity-10 px-4">
    <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-house me-2"></i>Customer Home</a>
    <div class="ms-auto"><a href="../auth/login.html" class="btn btn-outline-light btn-sm">Logout</a></div>
  </nav>

  <main class="container-fluid p-4">
    <div class="row g-4 mb-4">
      <div class="col-md-3"><div class="glass p-3"><div class="text-secondary">Balance</div><h3 class="mb-0">₹ 1,25,640</h3></div></div>
      <div class="col-md-3"><div class="glass p-3"><div class="text-secondary">Wallet</div><h3 class="mb-0">₹ 18,450</h3></div></div>
      <div class="col-md-3"><div class="glass p-3"><div class="text-secondary">Expenses</div><h3 class="mb-0">₹ 21,300</h3></div></div>
      <div class="col-md-3"><div class="glass p-3"><div class="text-secondary">Notifications</div><h3 class="mb-0">6</h3></div></div>
    </div>

    <div class="row g-4">
      <div class="col-lg-8">
        <div class="glass p-4">
          <h5 class="mb-3">Quick Links</h5>
          <div class="row g-3">
            <div class="col-md-4"><a href="transfer.html" class="btn btn-outline-light w-100 py-3">Transfer</a></div>
            <div class="col-md-4"><a href="wallet.html" class="btn btn-outline-light w-100 py-3">Wallet</a></div>
            <div class="col-md-4"><a href="expenses.html" class="btn btn-outline-light w-100 py-3">Expenses</a></div>
            <div class="col-md-4"><a href="notes.html" class="btn btn-outline-light w-100 py-3">Notes</a></div>
            <div class="col-md-4"><a href="receipts.html" class="btn btn-outline-light w-100 py-3">Receipts</a></div>
            <div class="col-md-4"><a href="support-chat.html" class="btn btn-outline-light w-100 py-3">Support</a></div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="glass p-4">
          <h5 class="mb-3">Today</h5>
          <ul class="list-group list-group-flush">
            <li class="list-group-item bg-transparent text-white border-secondary">Transfer completed</li>
            <li class="list-group-item bg-transparent text-white border-secondary">Salary received</li>
            <li class="list-group-item bg-transparent text-white border-secondary">Complaint updated</li>
          </ul>
        </div>
      </div>
    </div>
  </main>
  <script src="../js/app_theme.js"></script>
</body>
</html>
