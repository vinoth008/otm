<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="../assets/css/auth.css" rel="stylesheet">
  <style>
    .dash-body { background: linear-gradient(135deg, #0f172a, #111827); min-height: 100vh; color: #fff; }
    .glass { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(16px); border-radius: 20px; }
    .stat-icon { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; }
    .table-darkish { color: #e5e7eb; }
    .table-darkish td, .table-darkish th { border-color: rgba(255,255,255,0.08) !important; }
  </style>
  <link href="../css/app_theme.css" rel="stylesheet">
</head>
<body class="dash-body">
  <nav class="navbar navbar-expand-lg navbar-dark border-bottom border-light border-opacity-10">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-shield-halved me-2"></i>SOT System</a>
      <div class="ms-auto d-flex align-items-center gap-3">
        <button class="btn btn-outline-light btn-sm" id="themeBtn"><i class="fa-solid fa-moon"></i></button>
        <div class="dropdown">
          <button class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown">
            <i class="fa-solid fa-user me-1"></i>Customer
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="profile.html">Profile</a></li>
            <li><a class="dropdown-item" href="settings.html">Settings</a></li>
            <li><a class="dropdown-item" href="reports.html">Reports</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item text-danger" id="logoutBtn">Logout</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="container-fluid p-4">
    <div class="row g-4 mb-4">
      <div class="col-md-3">
        <div class="glass p-3 h-100">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <div class="text-secondary">Balance</div>
              <h3 class="mb-0" id="balanceVal">₹ 0</h3>
            </div>
            <div class="stat-icon bg-primary"><i class="fa-solid fa-wallet"></i></div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="glass p-3 h-100">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <div class="text-secondary">This Month Income</div>
              <h3 class="mb-0" id="incomeVal">₹ 0</h3>
            </div>
            <div class="stat-icon bg-success"><i class="fa-solid fa-arrow-trend-up"></i></div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="glass p-3 h-100">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <div class="text-secondary">This Month Expense</div>
              <h3 class="mb-0" id="expenseVal">₹ 0</h3>
            </div>
            <div class="stat-icon bg-danger"><i class="fa-solid fa-arrow-trend-down"></i></div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="glass p-3 h-100">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <div class="text-secondary">Savings Goal</div>
              <h3 class="mb-0" id="savingsVal">0%</h3>
            </div>
            <div class="stat-icon bg-warning"><i class="fa-solid fa-bullseye"></i></div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-lg-8">
        <div class="glass p-4 h-100">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Monthly Expense Trend</h5>
            <span class="badge text-bg-info">Chart.js</span>
          </div>
          <canvas id="expenseChart" height="120"></canvas>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="glass p-4 h-100">
          <h5 class="mb-3">Quick Actions</h5>
          <div class="d-grid gap-2">
            <button class="btn btn-outline-light" onclick="actionMsg('Deposit')"><i class="fa-solid fa-circle-plus me-2"></i>Deposit</button>
            <button class="btn btn-outline-light" onclick="actionMsg('Withdraw')"><i class="fa-solid fa-circle-minus me-2"></i>Withdraw</button>
            <button class="btn btn-outline-light" onclick="actionMsg('Transfer')"><i class="fa-solid fa-right-left me-2"></i>Transfer</button>
            <button class="btn btn-outline-light" onclick="actionMsg('Add Expense')"><i class="fa-solid fa-receipt me-2"></i>Add Expense</button>
            <button class="btn btn-outline-light" onclick="actionMsg('Add Note')"><i class="fa-solid fa-note-sticky me-2"></i>Add Note</button>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="glass p-4 h-100">
          <h5 class="mb-3">Recent Transactions</h5>
          <div class="table-responsive">
            <table class="table table-darkish align-middle mb-0">
              <thead>
                <tr>
                  <th>Ref</th>
                  <th>Type</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="recentTxBody">
                <tr><td colspan="5" class="text-center text-secondary">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="glass p-4 h-100">
          <h5 class="mb-3">Budget Summary</h5>
          <canvas id="budgetChart" height="180"></canvas>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    function actionMsg(name) {
      const pages = {
        'Deposit': 'transactions.html',
        'Withdraw': 'transactions.html',
        'Transfer': 'transfer.html',
        'Add Expense': 'expenses.html',
        'Add Note': 'notes.html'
      };
      window.location.href = pages[name] || 'transactions.html';
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      const result = await Swal.fire({ icon: 'question', title: 'Logout?', showCancelButton: true, confirmButtonText: 'Yes' });
      if (result.isConfirmed) {
        try {
          await apiPost('?module=auth&action=logout', {});
        } catch (e) { /* session may already be expired */ }
        location.href = '../auth/login.html';
      }
    });

    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const fmtINR = n => '₹ ' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 });

    let expenseChart, budgetChart;

    function renderCharts(stats) {
      const labels = MONTHS.slice(0, Math.max(1, (stats.monthly_expenses || []).length));
      const expData = stats.monthly_expenses || [];

      if (expenseChart) expenseChart.destroy();
      expenseChart = new Chart(document.getElementById('expenseChart'), {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Expense',
            data: expData,
            borderColor: '#60a5fa',
            backgroundColor: 'rgba(96,165,250,0.2)',
            tension: 0.35,
            fill: true
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#fff' } } },
          scales: {
            x: { ticks: { color: '#cbd5e1' }, grid: { color: 'rgba(255,255,255,0.08)' } },
            y: { ticks: { color: '#cbd5e1' }, grid: { color: 'rgba(255,255,255,0.08)' } }
          }
        }
      });

      const cat = stats.category_breakdown || {};
      const catLabels = Object.keys(cat);
      const catData = Object.values(cat);
      const palette = ['#22c55e','#3b82f6','#f97316','#ec4899','#a855f7','#14b8a6','#eab308','#ef4444'];

      if (budgetChart) budgetChart.destroy();
      budgetChart = new Chart(document.getElementById('budgetChart'), {
        type: 'bar',
        data: {
          labels: catLabels.length ? catLabels : ['No data'],
          datasets: [{
            label: 'Spent',
            data: catData.length ? catData : [0],
            backgroundColor: catLabels.map((_, i) => palette[i % palette.length])
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#cbd5e1' }, grid: { display: false } },
            y: { ticks: { color: '#cbd5e1' }, grid: { color: 'rgba(255,255,255,0.08)' } }
          }
        }
      });
    }

    function renderRecentTx(list) {
      const tb = document.getElementById('recentTxBody');
      if (!list || !list.length) {
        tb.innerHTML = '<tr><td colspan="5" class="text-center text-secondary">No transactions yet</td></tr>';
        return;
      }
      tb.innerHTML = list.map(t => {
        const typeBadge = t.type === 'income' ? 'text-bg-success' : t.type === 'expense' ? 'text-bg-danger' : 'text-bg-info';
        const sign = t.type === 'expense' ? '-' : '+';
        return `<tr>
          <td>${t._id.slice(-6).toUpperCase()}</td>
          <td>${t.type.charAt(0).toUpperCase() + t.type.slice(1)}</td>
          <td>${sign}₹ ${Number(t.amount).toLocaleString('en-IN')}</td>
          <td><span class="badge text-bg-success">Success</span></td>
          <td>${new Date(t.date).toLocaleDateString('en-IN', { day:'2-digit', month:'short' })}</td>
        </tr>`;
      }).join('');
    }

    async function loadDashboard() {
      try {
        const res = await apiGet('?module=dashboard&action=user_stats');
        const s = res.data;
        document.getElementById('balanceVal').textContent = fmtINR(s.balance);
        document.getElementById('incomeVal').textContent = fmtINR(s.total_income);
        document.getElementById('expenseVal').textContent = fmtINR(s.total_expense);
        document.getElementById('savingsVal').textContent = s.savings_rate + '%';
        renderRecentTx(s.recent_transactions);
        renderCharts(s);
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to load dashboard' });
      }
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
  <script src="../js/app_theme.js"></script>
</body>
</html>
