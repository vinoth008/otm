<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="../assets/css/auth.css" rel="stylesheet">
  <style>
    .dash-body { background: linear-gradient(135deg, #0f172a, #111827); min-height: 100vh; color: #fff; }
    .glass { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(16px); border-radius: 20px; }
    .form-control, .form-select { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; }
    .form-control:focus, .form-select:focus { background: rgba(255,255,255,0.12); color: #fff; border-color: #f59e0b; box-shadow: none; }
    .form-control::placeholder { color: #94a3b8; }
    .form-select option { background: #1e293b; color: #fff; }
  </style>
</head>
<body class="dash-body">
  <nav class="navbar navbar-dark border-bottom border-light border-opacity-10 px-4">
    <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fa-solid fa-right-left me-2"></i>Transfer Funds</a>
    <div class="ms-auto">
      <a href="dashboard.html" class="btn btn-outline-light btn-sm">Back to Dashboard</a>
    </div>
  </nav>

  <main class="container-fluid p-4">
    <div class="row g-4 mb-4">
      <div class="col-lg-7">
        <div class="glass p-4">
          <h5 class="mb-3">New Transfer</h5>
          <form id="transferForm" class="needs-validation" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">From Account</label>
                <select class="form-select" id="from_account" required>
                  <option value="">Select account</option>
                  <option value="Savings">Savings</option>
                  <option value="Wallet">Wallet</option>
                </select>
                <div class="invalid-feedback">Please select an account.</div>
              </div>

              <div class="col-md-6">
                <label class="form-label">Transfer Type</label>
                <select class="form-select" id="transfer_type" required>
                  <option value="TRANSFER">Internal Transfer</option>
                  <option value="SCHEDULED_TRANSFER">Scheduled Transfer</option>
                  <option value="RECURRING_TRANSFER">Recurring Transfer</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label">Beneficiary</label>
                <input type="text" class="form-control" id="beneficiary" placeholder="Name / Account / UPI" required>
                <div class="invalid-feedback">Please enter a beneficiary.</div>
              </div>

              <div class="col-md-6">
                <label class="form-label">Amount</label>
                <input type="number" class="form-control" id="amount" min="1" step="0.01" required>
                <div class="invalid-feedback">Enter a valid amount.</div>
              </div>

              <div class="col-md-6">
                <label class="form-label">PIN</label>
                <input type="password" class="form-control" id="pin" maxlength="6" required>
                <div class="invalid-feedback">Enter your PIN.</div>
              </div>

              <div class="col-md-6">
                <label class="form-label">OTP</label>
                <input type="text" class="form-control" id="otp" maxlength="6" placeholder="Optional if enabled">
              </div>

              <div class="col-md-6">
                <label class="form-label">Schedule Date</label>
                <input type="date" class="form-control" id="scheduled_at">
              </div>

              <div class="col-md-6">
                <label class="form-label">Remarks</label>
                <input type="text" class="form-control" id="remarks" placeholder="Optional note">
              </div>

              <div class="col-12">
                <button class="btn btn-primary w-100" type="submit">
                  <i class="fa-solid fa-paper-plane me-2"></i>Proceed Transfer
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="glass p-4 h-100">
          <h5 class="mb-3">Transfer Trends</h5>
          <canvas id="transferChart" height="220"></canvas>
        </div>
      </div>
    </div>

    <div class="glass p-4">
      <h5 class="mb-3">Recent Transfers</h5>
      <div class="table-responsive">
        <table class="table table-dark table-borderless align-middle mb-0">
          <thead>
            <tr>
              <th>Reference</th>
              <th>Beneficiary</th>
              <th>Amount</th>
              <th>Status</th>
              <th>Created At</th>
            </tr>
          </thead>
          <tbody id="transferTableBody">
            <tr><td colspan="5" class="text-center text-secondary">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    const fmtINR = n => '₹ ' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    let transferChart;

    async function loadTransfers() {
      try {
        const res = await apiGet('?module=transactions&action=get_all&type=transfer&limit=20');
        const list = res.data.transactions || [];
        const tb = document.getElementById('transferTableBody');
        if (!list.length) {
          tb.innerHTML = '<tr><td colspan="5" class="text-center text-secondary">No transfers yet</td></tr>';
        } else {
          tb.innerHTML = list.map(t => `
            <tr>
              <td>${t._id.slice(-6).toUpperCase()}</td>
              <td>${t.recipient_payer || '-'}</td>
              <td>${fmtINR(t.amount)}</td>
              <td><span class="badge text-bg-success">Success</span></td>
              <td>${t.created_at || '-'}</td>
            </tr>`).join('');
        }
        loadTrend();
      } catch (err) {
        document.getElementById('transferTableBody').innerHTML = '<tr><td colspan="5" class="text-center text-secondary">Failed to load transfers</td></tr>';
      }
    }

    async function loadTrend() {
      try {
        const res = await apiGet('?module=transactions&action=summary&period=year');
        const s = res.data;
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const data = months.map((_, i) => 0);
        (s.daily_trend || []).forEach(d => {
          const m = new Date(d.date).getMonth();
          data[m] += d.total;
        });
        if (transferChart) transferChart.destroy();
        transferChart = new Chart(document.getElementById('transferChart'), {
          type: 'line',
          data: {
            labels: months,
            datasets: [{
              label: 'Transfers',
              data,
              borderColor: '#22c55e',
              backgroundColor: 'rgba(34,197,94,0.2)',
              tension: 0.35,
              fill: true
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { labels: { color: '#fff' } } },
            scales: {
              x: { ticks: { color: '#cbd5e1' }, grid: { color: 'rgba(255,255,255,0.08)' } },
              y: { ticks: { color: '#cbd5e1' }, grid: { color: 'rgba(255,255,255,0.08)' } }
            }
          }
        });
      } catch (e) { /* optional */ }
    }

    document.getElementById('transferForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      form.classList.add('was-validated');
      if (!form.checkValidity()) return;

      const amount = parseFloat(document.getElementById('amount').value);
      const beneficiary = document.getElementById('beneficiary').value.trim();
      const confirm = await Swal.fire({
        icon: 'question',
        title: 'Confirm Transfer?',
        html: `Amount: <b>${fmtINR(amount)}</b><br>To: <b>${beneficiary}</b>`,
        showCancelButton: true,
        confirmButtonText: 'Yes, Transfer'
      });
      if (!confirm.isConfirmed) return;

      try {
        const payload = {
          type: 'transfer',
          category: 'Transfer',
          amount,
          description: `Transfer to ${beneficiary}`,
          date: document.getElementById('scheduled_at').value || new Date().toISOString().split('T')[0],
          payment_method: 'bank_transfer',
          recipient_payer: beneficiary,
          notes: document.getElementById('remarks').value.trim()
        };
        await apiPost('?module=transactions&action=create', payload);
        Swal.fire({ icon: 'success', title: 'Transfer Submitted', text: 'Your transfer has been placed successfully.' });
        form.reset();
        form.classList.remove('was-validated');
        loadTransfers();
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Transfer failed' });
      }
    });

    document.addEventListener('DOMContentLoaded', loadTransfers);
  </script>
</body>
</html>
