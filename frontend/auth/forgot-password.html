<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — SecureSOT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <script src="../assets/js/auth-theme.js"></script>
</head>
<body>
<button class="auth-theme-toggle" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon"><i class="fa-solid fa-key"></i></div>
      <h2>Forgot Password</h2>
      <p>Enter your email to receive an OTP</p>
    </div>
    <form id="forgot-form">
      <div class="auth-form-group">
        <label>Email Address</label>
        <div class="auth-input-wrap">
          <i class="fa-solid fa-envelope icon-left"></i>
          <input type="email" id="email" placeholder="your@email.com" required />
        </div>
      </div>
      <button type="submit" class="btn-auth"><i class="fa-solid fa-paper-plane"></i> Send OTP</button>
    </form>
    <div class="auth-footer"><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a></div>
  </div>
</div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
