<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Portal — SecureSOT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <style>
    .portal-select-card { max-width: 720px; }
    .portal-title { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); text-align: center; margin-bottom: 8px; }
    .portal-sub { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 28px; }
    .portal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .portal-card { background: var(--bg-card); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 32px 20px; text-align: center; cursor: pointer; transition: var(--transition); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 12px; min-height: 220px; justify-content: center; box-shadow: var(--shadow-sm); text-decoration: none; }
    .portal-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(135deg, var(--primary), var(--secondary)); opacity: 0; transition: var(--transition); }
    .portal-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .portal-card:hover::before { opacity: 1; }
    .portal-card-icon { width: 72px; height: 72px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 4px; color: #fff; }
    .portal-staff .portal-card-icon { background: linear-gradient(135deg, #6366f1, #4f46e5); box-shadow: 0 8px 24px rgba(99,102,241,0.35); }
    .portal-customer .portal-card-icon { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 8px 24px rgba(16,185,129,0.35); }
    .portal-card-title { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); }
    .portal-card-desc { font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; max-width: 220px; }
    .portal-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); margin-top: 4px; }
    .portal-back { text-align: center; margin-top: 26px; }
    .portal-back a { color: var(--text-muted); font-size: 0.82rem; display: inline-flex; align-items: center; gap: 6px; transition: var(--transition); }
    .portal-back a:hover { color: var(--primary-light); }
    @media (max-width: 600px) { .portal-grid { grid-template-columns: 1fr; } .portal-card { min-height: 180px; padding: 24px 16px; } }
  </style>
  <script src="../assets/js/auth-theme.js"></script>
</head>
<body>
<button class="auth-theme-toggle" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
<div class="auth-page">
  <div class="auth-card portal-select-card">
    <div class="auth-logo">
      <div class="auth-logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
      <h2>SecureSOT</h2>
      <p>Secure Online Transaction System</p>
    </div>
    <div class="portal-title">Select Your Portal</div>
    <div class="portal-sub">Choose the portal you want to sign in to</div>
    <div class="portal-grid">
      <a href="login-staff.html" class="portal-card portal-staff">
        <div class="portal-card-icon"><i class="fa-solid fa-user-tie"></i></div>
        <div class="portal-card-title">Admin / Receptionist</div>
        <div class="portal-card-desc">Manage system, users, appointments, and operations</div>
        <div class="portal-badge"><i class="fa-solid fa-shield-halved"></i> Staff Portal</div>
      </a>
      <a href="login-customer.html" class="portal-card portal-customer">
        <div class="portal-card-icon"><i class="fa-solid fa-user"></i></div>
        <div class="portal-card-title">Customer</div>
        <div class="portal-card-desc">Access your wallet, transactions, transfers, and expenses</div>
        <div class="portal-badge"><i class="fa-solid fa-user"></i> Customer Portal</div>
      </a>
    </div>
    <div class="portal-back"><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Use role selector instead</a></div>
  </div>
</div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
