<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — SecureSOT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <script src="../assets/js/auth-theme.js"></script>
</head>
<body>
<button class="auth-theme-toggle" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon"><i class="fa-solid fa-lock-open"></i></div>
      <h2>Reset Password</h2>
      <p>Set a new secure password for your account</p>
    </div>
    <form id="reset-form">
      <div class="auth-form-group">
        <label>New Password</label>
        <div class="auth-input-wrap">
          <i class="fa-solid fa-lock icon-left"></i>
          <input type="password" id="password" placeholder="Min. 8 characters" required />
          <button type="button" class="toggle-password"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <div class="auth-form-group">
        <label>Confirm Password</label>
        <div class="auth-input-wrap">
          <i class="fa-solid fa-lock icon-left"></i>
          <input type="password" id="confirm-password" placeholder="Repeat new password" required />
          <button type="button" class="toggle-password"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-auth"><i class="fa-solid fa-rotate"></i> Reset Password</button>
    </form>
    <div class="auth-footer"><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a></div>
  </div>
</div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
