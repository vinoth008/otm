<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Customers | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/css/auth.css" rel="stylesheet">
  <style>.dash-body{background:#0f172a;min-height:100vh;color:#fff}.glass{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(16px);border-radius:20px}</style>
</head>
<body class="dash-body">
  <main class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="mb-0"><i class="fa-solid fa-users me-2"></i>Customer List</h3>
      <a class="btn btn-outline-light" href="dashboard.html"><i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard</a>
    </div>

    <div class="glass p-4 mb-4">
      <div class="row g-3">
        <div class="col-md-4"><input class="form-control" id="searchInput" placeholder="Search customer..."></div>
        <div class="col-md-3"><select class="form-select" id="statusFilter"><option value="">All Status</option><option value="active">Active</option><option value="suspended">Suspended</option><option value="inactive">Inactive</option></select></div>
        <div class="col-md-3"><select class="form-select" id="roleFilter"><option value="">All Roles</option><option value="user">Customer</option><option value="staff">Staff</option><option value="receptionist">Receptionist</option></select></div>
        <div class="col-md-2"><button class="btn btn-outline-light w-100" onclick="loadCustomers()">Search</button></div>
      </div>
    </div>

    <div class="glass p-4">
      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle mb-0">
          <thead><tr><th>Name</th><th>Email</th><th>Mobile</th><th>Role</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="customerTableBody">
            <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3">
        <span class="text-muted" id="pageInfo">Page 1</span>
        <div>
          <button class="btn btn-sm btn-outline-light me-2" id="prevBtn" onclick="changePage(-1)">Prev</button>
          <button class="btn btn-sm btn-outline-light" id="nextBtn" onclick="changePage(1)">Next</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/api.js"></script>
  <script>
let currentPage = 1;
let totalPages = 1;

function statusBadge(status) {
  const map = { active: 'success', suspended: 'warning', inactive: 'secondary' };
  return `<span class="badge text-bg-${map[status] || 'secondary'}">${status || 'active'}</span>`;
}

async function loadCustomers() {
  const search = document.getElementById('searchInput').value.trim();
  const status = document.getElementById('statusFilter').value;
  const role = document.getElementById('roleFilter').value;
  const params = new URLSearchParams({ module: 'users', action: 'get_all', page: currentPage, limit: 20 });
  if (search) params.set('search', search);
  if (status) params.set('status', status);
  if (role) params.set('role', role);
  try {
    const res = await apiGet('?' + params.toString());
    const d = res.data;
    const tbody = document.getElementById('customerTableBody');
    tbody.innerHTML = '';
    if (d.users && d.users.length) {
      d.users.forEach(u => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${u.first_name} ${u.last_name || ''}</td>
          <td>${u.email}</td>
          <td>${u.phone || '—'}</td>
          <td>${u.role}</td>
          <td>${statusBadge(u.status)}</td>
          <td><button class="btn btn-sm btn-outline-light" onclick="openCustomer('${u.first_name} ${u.last_name || ''}', '${u.email}')">View</button></td>`;
        tbody.appendChild(tr);
      });
    } else {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No customers found</td></tr>';
    }
    totalPages = d.pagination ? d.pagination.total_pages : 1;
    document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
    document.getElementById('prevBtn').disabled = currentPage <= 1;
    document.getElementById('nextBtn').disabled = currentPage >= totalPages;
  } catch (e) {
    Swal.fire({ icon: 'error', title: 'Error', text: e.message });
  }
}

function changePage(delta) {
  const next = currentPage + delta;
  if (next < 1 || next > totalPages) return;
  currentPage = next;
  loadCustomers();
}

function openCustomer(name, email) {
  Swal.fire({ icon: 'info', title: name, text: `Email: ${email}` });
}

document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') { currentPage = 1; loadCustomers(); } });
document.getElementById('statusFilter').addEventListener('change', () => { currentPage = 1; loadCustomers(); });
document.getElementById('roleFilter').addEventListener('change', () => { currentPage = 1; loadCustomers(); });

loadCustomers();
  </script>
</body>
</html>
