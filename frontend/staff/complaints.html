<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Complaints | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/css/auth.css" rel="stylesheet">
  <style>.dash-body{background:#0f172a;min-height:100vh;color:#fff}.glass{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(16px);border-radius:20px}</style>
  <link href="../css/app_theme.css" rel="stylesheet">
</head>
<body class="dash-body">
  <main class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="mb-0"><i class="fa-solid fa-headset me-2"></i>Customer Complaints</h3>
      <a class="btn btn-outline-light" href="dashboard.html"><i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard</a>
    </div>

    <div class="glass p-4 mb-4">
      <div class="row g-3">
        <div class="col-md-4"><input class="form-control" id="searchInput" placeholder="Search ticket, customer, subject..."></div>
        <div class="col-md-3"><select class="form-select" id="statusFilter"><option value="">All Status</option><option value="Open">Open</option><option value="In Progress">In Progress</option><option value="Resolved">Resolved</option><option value="Closed">Closed</option></select></div>
        <div class="col-md-3"><select class="form-select" id="priorityFilter"><option value="">All Priority</option><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option><option value="Critical">Critical</option></select></div>
        <div class="col-md-2"><button class="btn btn-outline-light w-100" onclick="loadComplaints()">Search</button></div>
      </div>
    </div>

    <div class="glass p-4">
      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle mb-0">
          <thead><tr><th>Ticket</th><th>Customer</th><th>Subject</th><th>Priority</th><th>Status</th><th>Date</th><th>Action</th></tr></thead>
          <tbody id="complaintTableBody">
            <tr><td colspan="7" class="text-center text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3">
        <span class="text-muted" id="pageInfo">Page 1</span>
        <div>
          <button class="btn btn-sm btn-outline-light me-2" id="prevBtn" onclick="changePage(-1)">Prev</button>
          <button class="btn btn-sm btn-outline-light" id="nextBtn" onclick="changePage(1)">Next</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/api.js"></script>
  <script>
let currentPage = 1;
let totalPages = 1;

function priorityBadge(p) {
  const map = { Low: 'secondary', Medium: 'info', High: 'warning', Critical: 'danger' };
  return `<span class="badge text-bg-${map[p] || 'secondary'}">${p || '—'}</span>`;
}

function statusBadge(s) {
  const map = { Open: 'danger', 'In Progress': 'warning', Resolved: 'success', Closed: 'secondary' };
  return `<span class="badge text-bg-${map[s] || 'secondary'}">${s || '—'}</span>`;
}

async function loadComplaints() {
  const search = document.getElementById('searchInput').value.trim();
  const status = document.getElementById('statusFilter').value;
  const priority = document.getElementById('priorityFilter').value;
  const params = new URLSearchParams({ module: 'complaints', action: 'get_all', page: currentPage, limit: 20 });
  if (search) params.set('search', search);
  if (status) params.set('status', status);
  if (priority) params.set('priority', priority);
  try {
    const res = await apiGet('?' + params.toString());
    const d = res.data;
    const tbody = document.getElementById('complaintTableBody');
    tbody.innerHTML = '';
    if (d.complaints && d.complaints.length) {
      d.complaints.forEach(c => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${c.ticket_no || '—'}</td>
          <td>${c.customer_name || '—'}</td>
          <td>${c.subject || '—'}</td>
          <td>${priorityBadge(c.priority)}</td>
          <td>${statusBadge(c.status)}</td>
          <td>${c.created_at || '—'}</td>
          <td><button class="btn btn-sm btn-outline-light" onclick="viewComplaint('${c._id}')">View</button></td>`;
        tbody.appendChild(tr);
      });
    } else {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No complaints found</td></tr>';
    }
    totalPages = d.pagination ? d.pagination.total_pages : 1;
    document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
    document.getElementById('prevBtn').disabled = currentPage <= 1;
    document.getElementById('nextBtn').disabled = currentPage >= totalPages;
  } catch (e) {
    Swal.fire({ icon: 'error', title: 'Error', text: e.message });
  }
}

function changePage(delta) {
  const next = currentPage + delta;
  if (next < 1 || next > totalPages) return;
  currentPage = next;
  loadComplaints();
}

async function viewComplaint(id) {
  try {
    const res = await apiGet(`?module=complaints&action=get&id=${id}`);
    const c = res.data;
    Swal.fire({
      title: c.subject || 'Complaint',
      html: `<p><strong>Ticket:</strong> ${c.ticket_no || '—'}</p>
             <p><strong>Customer:</strong> ${c.customer_name || '—'}</p>
             <p><strong>Description:</strong> ${c.description || '—'}</p>
             <p><strong>Priority:</strong> ${c.priority || '—'}</p>
             <p><strong>Status:</strong> ${c.status || '—'}</p>
             <p><strong>Staff Reply:</strong> ${c.staff_reply || 'No reply yet'}</p>`,
      confirmButtonText: 'Close'
    });
  } catch (e) {
    Swal.fire({ icon: 'error', title: 'Error', text: e.message });
  }
}

document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') { currentPage = 1; loadComplaints(); } });
document.getElementById('statusFilter').addEventListener('change', () => { currentPage = 1; loadComplaints(); });
document.getElementById('priorityFilter').addEventListener('change', () => { currentPage = 1; loadComplaints(); });

loadComplaints();
  </script>
  <script src="../js/app_theme.js"></script>
</body>
</html>
