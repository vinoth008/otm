<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Transactions | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/css/auth.css" rel="stylesheet">
  <style>.dash-body{background:#0f172a;min-height:100vh;color:#fff}.glass{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(16px);border-radius:20px}</style>
</head>
<body class="dash-body">
  <main class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="mb-0"><i class="fa-solid fa-right-left me-2"></i>All Transactions</h3>
      <a class="btn btn-outline-light" href="dashboard.html"><i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard</a>
    </div>

    <div class="glass p-4 mb-4">
      <div class="row g-3">
        <div class="col-md-3"><input class="form-control" id="searchInput" placeholder="Search..."></div>
        <div class="col-md-2"><select class="form-select" id="typeFilter"><option value="">All Types</option><option value="income">Income</option><option value="expense">Expense</option><option value="transfer">Transfer</option></select></div>
        <div class="col-md-2"><input class="form-control" type="date" id="dateFrom"></div>
        <div class="col-md-2"><input class="form-control" type="date" id="dateTo"></div>
        <div class="col-md-3"><button class="btn btn-outline-light w-100" onclick="loadTransactions()">Search</button></div>
      </div>
    </div>

    <div class="glass p-4">
      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle mb-0">
          <thead><tr><th>User</th><th>Type</th><th>Category</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
          <tbody id="txTableBody">
            <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3">
        <span class="text-muted" id="pageInfo">Page 1</span>
        <div>
          <button class="btn btn-sm btn-outline-light me-2" id="prevBtn" onclick="changePage(-1)">Prev</button>
          <button class="btn btn-sm btn-outline-light" id="nextBtn" onclick="changePage(1)">Next</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/api.js"></script>
  <script>
let currentPage = 1;
let totalPages = 1;

function fmtINR(n) {
  return '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
}

function typeBadge(type) {
  const map = { income: 'success', expense: 'danger', transfer: 'info' };
  return `<span class="badge text-bg-${map[type] || 'secondary'}">${type || '—'}</span>`;
}

function statusBadge(status) {
  const map = { success: 'success', failed: 'danger', pending: 'warning' };
  return `<span class="badge text-bg-${map[status] || 'secondary'}">${status || '—'}</span>`;
}

async function loadTransactions() {
  const search = document.getElementById('searchInput').value.trim();
  const type = document.getElementById('typeFilter').value;
  const dateFrom = document.getElementById('dateFrom').value;
  const dateTo = document.getElementById('dateTo').value;
  const params = new URLSearchParams({ module: 'transactions', action: 'admin_all', page: currentPage, limit: 20 });
  if (search) params.set('search', search);
  if (type) params.set('type', type);
  if (dateFrom) params.set('date_from', dateFrom);
  if (dateTo) params.set('date_to', dateTo);
  try {
    const res = await apiGet('?' + params.toString());
    const d = res.data;
    const tbody = document.getElementById('txTableBody');
    tbody.innerHTML = '';
    if (d.transactions && d.transactions.length) {
      d.transactions.forEach(t => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${t.user_name || 'Unknown'}</td>
          <td>${typeBadge(t.type)}</td>
          <td>${t.category || '—'}</td>
          <td>${fmtINR(t.amount)}</td>
          <td>${statusBadge(t.status)}</td>
          <td>${t.date || '—'}</td>`;
        tbody.appendChild(tr);
      });
    } else {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No transactions found</td></tr>';
    }
    totalPages = d.pagination ? d.pagination.total_pages : 1;
    document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
    document.getElementById('prevBtn').disabled = currentPage <= 1;
    document.getElementById('nextBtn').disabled = currentPage >= totalPages;
  } catch (e) {
    Swal.fire({ icon: 'error', title: 'Error', text: e.message });
  }
}

function changePage(delta) {
  const next = currentPage + delta;
  if (next < 1 || next > totalPages) return;
  currentPage = next;
  loadTransactions();
}

document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') { currentPage = 1; loadTransactions(); } });
document.getElementById('typeFilter').addEventListener('change', () => { currentPage = 1; loadTransactions(); });
document.getElementById('dateFrom').addEventListener('change', () => { currentPage = 1; loadTransactions(); });
document.getElementById('dateTo').addEventListener('change', () => { currentPage = 1; loadTransactions(); });

loadTransactions();
  </script>
</body>
</html>
