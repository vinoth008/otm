<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Smart Transaction Control</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="error-page">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">The page you are looking for doesn't exist or has been moved.</p>
        <div class="error-actions">
            <a href="dashboard.html" class="btn btn-primary"><i class="fas fa-home"></i> Back to Dashboard</a>
            <a href="javascript:history.back()" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Go Back</a>
        </div>
    </div>
    <style>
        .error-page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .error-code { font-size: 6rem; font-weight: 800; color: var(--primary-color, #4f46e5); opacity: .9; }
        .error-title { font-size: 1.5rem; margin: 8px 0; color: var(--text-primary, #0f172a); }
        .error-message { color: var(--text-secondary, #64748b); max-width: 420px; margin-bottom: 24px; }
        .error-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    </style>
</body>
</html>
