<!-- Shared toast / alert notifications (STC) -->
<div id="sharedToastContainer" class="shared-toast-container"></div>
<style>
.shared-toast-container { position: fixed; top: 16px; right: 16px; z-index: 10000; display: flex; flex-direction: column; gap: 12px; max-width: 360px; }
.shared-toast { border-radius: 12px; padding: 14px 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); color: #fff; font-size: .875rem; display: flex; align-items: flex-start; gap: 10px; animation: toast-in .25s ease; }
.shared-toast.success { background: #10b981; }
.shared-toast.error { background: #ef4444; }
.shared-toast.info { background: #6366f1; }
.shared-toast.warning { background: #f59e0b; }
.shared-toast.hide { opacity: 0; transform: translateX(20px); transition: all .3s; }
.shared-toast i { margin-top: 2px; }
@keyframes toast-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
</style>
<script>
window.STC = window.STC || {};
STC.alert = function (message, type) {
    type = type || 'info';
    var container = document.getElementById('sharedToastContainer');
    if (!container) return;
    var toast = document.createElement('div');
    toast.className = 'shared-toast ' + type;
    var icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', warning: 'fa-triangle-exclamation', info: 'fa-circle-info' };
    toast.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i><span>' + message + '</span>';
    container.appendChild(toast);
    setTimeout(function () {
        toast.classList.add('hide');
        setTimeout(function () { toast.remove(); }, 300);
    }, 3500);
};
</script>
