<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receptionist Settings | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/css/auth.css" rel="stylesheet">
  <style>.dash-body{background:#0f172a;min-height:100vh;color:#fff}.glass{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(16px);border-radius:20px}.form-control,.form-select{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff}.form-control:focus,.form-select:focus{background:rgba(255,255,255,0.12);color:#fff;border-color:#f59e0b;box-shadow:none}.form-control::placeholder{color:#94a3b8}.form-select option{background:#1e293b;color:#fff}</style>
  <link href="../css/app_theme.css" rel="stylesheet">
</head>
<body class="dash-body">
  <main class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="mb-0"><i class="fa-solid fa-gear me-2"></i>Settings</h3>
      <a class="btn btn-outline-light" href="dashboard.html"><i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard</a>
    </div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="glass p-4">
          <h5 class="mb-3"><i class="fa-solid fa-user me-2"></i>Profile</h5>
          <form id="profileForm" class="row g-3">
            <div class="col-md-6"><label class="form-label">First Name</label><input class="form-control" id="first_name" required></div>
            <div class="col-md-6"><label class="form-label">Last Name</label><input class="form-control" id="last_name"></div>
            <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" id="email" type="email" required></div>
            <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" id="phone"></div>
            <div class="col-12"><button class="btn btn-success" type="submit">Update Profile</button></div>
          </form>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="glass p-4">
          <h5 class="mb-3"><i class="fa-solid fa-lock me-2"></i>Change Password</h5>
          <form id="passwordForm" class="row g-3">
            <div class="col-12"><label class="form-label">Current Password</label><input class="form-control" id="current_password" type="password" required></div>
            <div class="col-12"><label class="form-label">New Password</label><input class="form-control" id="new_password" type="password" required></div>
            <div class="col-12"><label class="form-label">Confirm New Password</label><input class="form-control" id="confirm_password" type="password" required></div>
            <div class="col-12"><button class="btn btn-warning" type="submit">Change Password</button></div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    async function loadProfile() {
      try {
        const res = await apiGet('?module=profile&action=get');
        const p = res.data;
        document.getElementById('first_name').value = p.first_name || '';
        document.getElementById('last_name').value = p.last_name || '';
        document.getElementById('email').value = p.email || '';
        document.getElementById('phone').value = p.phone || '';
      } catch (e) {
        Swal.fire({ icon: 'error', title: 'Error', text: e.message });
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await apiPost('?module=profile&action=update', {
          first_name: document.getElementById('first_name').value.trim(),
          last_name: document.getElementById('last_name').value.trim(),
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim()
        });
        Swal.fire({ icon: 'success', title: 'Updated', text: 'Profile updated successfully.' });
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message });
      }
    });

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const np = document.getElementById('new_password').value;
      const cp = document.getElementById('confirm_password').value;
      if (np !== cp) {
        Swal.fire({ icon: 'warning', title: 'Validation', text: 'New passwords do not match.' });
        return;
      }
      try {
        await apiPost('?module=profile&action=change_password', {
          current_password: document.getElementById('current_password').value,
          new_password: np,
          confirm_password: cp
        });
        Swal.fire({ icon: 'success', title: 'Updated', text: 'Password changed successfully.' });
        document.getElementById('passwordForm').reset();
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message });
      }
    });

    loadProfile();
  </script>
  <script src="../js/app_theme.js"></script>
</body>
</html>
