<!-- frontend/html/complaints.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support & Complaints - Smart Transaction Control</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div class="content-area" style="padding: 24px;">
                <div class="card" style="padding: 20px; margin-bottom: 20px;">
                    <div class="table-header">
                        <div>
                            <h3 class="table-title">My Complaints</h3>
                            <p style="font-size: 0.85rem; color: var(--text-secondary);">Raise and track support tickets with our team.</p>
                        </div>
                        <button class="btn btn-sm btn-primary" id="openComplaintBtn"><i class="fas fa-plus"></i> New Complaint</button>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Subject</th>
                                    <th>Category</th>
                                    <th>Priority</th>
                                    <th>Status</th>
                                    <th>Response</th>
                                </tr>
                            </thead>
                            <tbody id="complaintTableBody">
                                <tr><td colspan="6" class="text-center"><div class="spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Complaint Modal -->
    <div class="modal" id="addComplaintModal">
        <div class="modal-content" style="max-width: 520px;">
            <div class="modal-header">
                <h3 class="modal-title">New Complaint</h3>
                <button class="modal-close" onclick="closeModal('addComplaintModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="addComplaintForm">
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="cfSubject" class="form-control" placeholder="Short summary">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="cfDescription" class="form-control" rows="5" placeholder="Describe the issue..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="cfCategory" class="form-control">
                            <option value="General">General</option>
                            <option value="Account">Account</option>
                            <option value="Transaction">Transaction</option>
                            <option value="Technical">Technical</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="cfPriority" class="form-control">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addComplaintModal')">Cancel</button>
                <button class="btn btn-primary" id="saveComplaintBtn"><i class="fas fa-paper-plane"></i> Submit</button>
            </div>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/app_common.js"></script>
    <script src="../js/banking.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ roles: ['customer'], title: 'Support & Complaints', page: 'complaints.html', init: initComplaints });
        });
    </script>
</body>
</html>
