<!-- frontend/html/user/dashboard.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Employee | Smart Transaction Control</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div class="content-area" style="padding: 24px;">
                <!-- Stat Cards -->
                <div class="stat-grid" id="statGrid">
                    <div class="card stat-card">
                        <div class="stat-icon" style="background: rgba(79,70,229,0.15); color: #4f46e5;">
                            <i class="fas fa-wallet"></i>
                        </div>
                        <div class="stat-details">
                            <span class="stat-label">Total Expenses</span>
                            <span class="stat-value" id="statTotal">₹0.00</span>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon" style="background: rgba(245,158,11,0.15); color: #f59e0b;">
                            <i class="fas fa-clock"></i>
                        </div>
                        <div class="stat-details">
                            <span class="stat-label">Pending</span>
                            <span class="stat-value" id="statPending">₹0.00</span>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon" style="background: rgba(16,185,129,0.15); color: #10b981;">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="stat-details">
                            <span class="stat-label">Approved</span>
                            <span class="stat-value" id="statApproved">₹0.00</span>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon" style="background: rgba(239,68,68,0.15); color: #ef4444;">
                            <i class="fas fa-times-circle"></i>
                        </div>
                        <div class="stat-details">
                            <span class="stat-label">Rejected</span>
                            <span class="stat-value" id="statRejected">₹0.00</span>
                        </div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                    <!-- Expense Chart -->
                    <div class="card" style="padding: 20px;">
                        <h3 class="card-title">Expense Summary (This Month)</h3>
                        <div style="height: 300px; position: relative;">
                            <canvas id="expenseChart"></canvas>
                        </div>
                    </div>
                    <!-- Category Breakdown -->
                    <div class="card" style="padding: 20px;">
                        <h3 class="card-title">Category Breakdown</h3>
                        <div style="height: 300px; position: relative;">
                            <canvas id="categoryChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Recent Expenses -->
                <div class="card" style="padding: 20px; margin-top: 20px;">
                    <div class="table-header">
                        <h3 class="table-title">Recent Expenses</h3>
                        <a href="expenses.html" class="btn btn-sm btn-secondary"><i class="fas fa-eye"></i> View All</a>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Category</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="recentExpensesBody">
                                <tr><td colspan="5" class="text-center"><div class="spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/utils.js"></script>
    <script src="../../js/app_common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ roles: ['user'], title: 'Employee Dashboard', page: 'dashboard.html', init: initUserDash });
        });

        async function initUserDash(s) {
            try {
                const stats = await STC.get('expense_crud.php', 'stats', { period: 'month' });
                document.getElementById('statTotal').textContent = '₹' + Number(stats.total_expense || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 });
                document.getElementById('statPending').textContent = '₹' + Number(stats.pending || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 });
                document.getElementById('statApproved').textContent = '₹' + Number(stats.approved || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 });
                document.getElementById('statRejected').textContent = '₹' + Number(stats.rejected || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 });

                // Category chart (Pie)
                const ctxCat = document.getElementById('categoryChart');
                if (ctxCat) {
                    const cats = stats.category_breakdown || [];
                    new Chart(ctxCat, {
                        type: 'pie',
                        data: {
                            labels: cats.map(c => c.category),
                            datasets: [{
                                data: cats.map(c => c.total),
                                backgroundColor: ['#4f46e5', '#06b6d4', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#f97316', '#14b8a6']
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
                    });
                }
            } catch (e) {
                console.error(e);
            }

            try {
                const data = await STC.get('expense_crud.php', 'get_all', { limit: 5 });
                const tbody = document.getElementById('recentExpensesBody');
                if (!data.expenses || data.expenses.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No expenses found</td></tr>';
                } else {
                    tbody.innerHTML = data.expenses.map(e => `
                        <tr>
                            <td>${STC.esc(e.expense_date)}</td>
                            <td>${STC.esc(e.category)}</td>
                            <td>${STC.esc(e.description)}</td>
                            <td class="text-bold">₹${Number(e.amount).toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
                            <td>${STC.badge(e.status)}</td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                console.error(e);
                document.getElementById('recentExpensesBody').innerHTML = '<tr><td colspan="5" class="text-center text-muted">Failed to load</td></tr>';
            }
        }
    </script>
</body>
</html>
