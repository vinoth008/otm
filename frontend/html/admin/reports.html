<!-- frontend/html/admin/reports.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Admin | Smart Transaction Control</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div class="content-area" style="padding: 24px;">
                <div class="card" style="padding: 20px; margin-bottom: 20px;">
                    <div class="table-header" style="flex-wrap: wrap; gap: 12px;">
                        <div>
                            <h3 class="table-title">Reports</h3>
                            <p style="font-size: 0.85rem; color: var(--text-secondary);">Generate aggregated reports for operations.</p>
                        </div>
                        <div class="table-actions" style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <select id="reportType" class="form-control" style="width: auto;">
                                <option value="transactions">Transactions</option>
                                <option value="transfers">Transfers</option>
                                <option value="complaints">Complaints</option>
                            </select>
                            <input type="date" id="reportFrom" class="form-control" style="width: auto;">
                            <input type="date" id="reportTo" class="form-control" style="width: auto;">
                            <button class="btn btn-sm btn-primary" id="generateReportBtn"><i class="fas fa-sync"></i> Generate</button>
                            <button class="btn btn-sm btn-outline" id="exportReportBtn"><i class="fas fa-download"></i> Export CSV</button>
                        </div>
                    </div>
                    <div id="reportSummary" style="display: flex; gap: 16px; margin-bottom: 16px;"></div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Label</th>
                                    <th>Count</th>
                                    <th>Total Amount</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="reportTableBody">
                                <tr><td colspan="4" class="text-center"><div class="spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../../js/utils.js"></script>
    <script src="../../js/app_common.js"></script>
    <script src="../../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ roles: ['admin'], title: 'Reports', page: 'reports.html', init: initAdminReports });
        });
    </script>
</body>
</html>
