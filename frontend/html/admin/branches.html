<!-- frontend/html/admin/branches.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branches - Admin | Smart Transaction Control</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div class="content-area" style="padding: 24px;">
                <div class="card" style="padding: 20px; margin-bottom: 20px;">
                    <div class="table-header">
                        <div>
                            <h3 class="table-title">Branch Network</h3>
                            <p style="font-size: 0.85rem; color: var(--text-secondary);">Manage physical branches across the network.</p>
                        </div>
                        <button class="btn btn-sm btn-primary" id="openAddBranchBtn"><i class="fas fa-plus"></i> Add Branch</button>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Code</th>
                                    <th>City</th>
                                    <th>Address</th>
                                    <th>Phone</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="branchesTableBody">
                                <tr><td colspan="7" class="text-center"><div class="spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Branch Modal -->
    <div class="modal" id="addBranchModal">
        <div class="modal-content" style="max-width: 520px;">
            <div class="modal-header">
                <h3 class="modal-title">Add New Branch</h3>
                <button class="modal-close" onclick="closeModal('addBranchModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="addBranchForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Branch Name</label>
                            <input type="text" id="nbName" class="form-control" placeholder="Main Branch">
                        </div>
                        <div class="form-group">
                            <label>Branch Code</label>
                            <input type="text" id="nbCode" class="form-control" placeholder="MB001">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" id="nbAddress" class="form-control" placeholder="Street address">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" id="nbCity" class="form-control" placeholder="Chennai">
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="text" id="nbPhone" class="form-control" placeholder="044 1234 5678">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="nbEmail" class="form-control" placeholder="branch@example.com">
                        </div>
                        <div class="form-group">
                            <label>Manager</label>
                            <input type="text" id="nbManager" class="form-control" placeholder="Manager name">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Opening Hours</label>
                        <input type="text" id="nbHours" class="form-control" value="9:00 AM - 5:00 PM">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addBranchModal')">Cancel</button>
                <button class="btn btn-primary" id="saveBranchBtn"><i class="fas fa-save"></i> Create Branch</button>
            </div>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/app_common.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ roles: ['admin'], title: 'Branches', page: 'branches.html', init: initAdminBranches });
        });
    </script>
</body>
</html>
