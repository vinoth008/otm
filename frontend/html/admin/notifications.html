<!-- frontend/html/admin/notifications.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Admin | Smart Transaction Control</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div class="content-area" style="padding: 24px;">
                <div class="card" style="padding: 20px; margin-bottom: 20px;">
                    <h3 class="table-title">Send Broadcast Notification</h3>
                    <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px;">
                        Send an announcement to all users or targeted recipients.
                    </p>
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="notifTitle" class="form-control" placeholder="e.g. Maintenance scheduled">
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea id="notifMessage" class="form-control" rows="3" placeholder="Write your announcement..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Type</label>
                            <select id="notifType" class="form-control">
                                <option value="general">General</option>
                                <option value="system">System</option>
                                <option value="complaint">Complaint</option>
                                <option value="receipt">Receipt</option>
                                <option value="appointment">Appointment</option>
                                <option value="transfer">Transfer</option>
                            </select>
                        </div>
                        <div class="form-group" style="display: flex; align-items: flex-end; gap: 8px;">
                            <button class="btn btn-outline" id="sendTestNotificationBtn"><i class="fas fa-flask"></i> Fill Sample</button>
                            <button class="btn btn-primary" id="sendNotificationBtn"><i class="fas fa-paper-plane"></i> Send to All</button>
                        </div>
                    </div>
                </div>
                <div class="card" style="padding: 20px;">
                    <h3 class="table-title">Recent Notifications</h3>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Message</th>
                                    <th>Type</th>
                                    <th>Status</th>
                                    <th>Sent</th>
                                </tr>
                            </thead>
                            <tbody id="sentNotificationsTable">
                                <tr><td colspan="5" class="text-center"><div class="spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/utils.js"></script>
    <script src="../js/app_common.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ roles: ['admin'], title: 'Notifications', page: 'notifications.html', init: initAdminNotifications });
        });
    </script>
</body>
</html>
