<!-- frontend/html/profile.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Smart Transaction Control</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div class="content-area" style="padding: 24px;">
                <div style="display: grid; grid-template-columns: 300px 1fr; gap: 24px;">
                    <!-- Profile Card -->
                    <div class="card" style="text-align: center; padding: 24px 20px; align-self: start;">
                        <div style="position: relative; display: inline-block;">
                            <img id="avatarImg" src="https://ui-avatars.com/api/svg?name=User&color=4f46e5&background=e0e7ff&size=120" alt="Profile Avatar" style="width: 120px; height: 120px; border-radius: 50%; margin-bottom: 16px; object-fit: cover;">
                            <label for="photoInput" style="position: absolute; bottom: 16px; right: 0; background: var(--primary-color); color: white; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px rgba(79,70,229,0.35);">
                                <i class="fas fa-camera" style="font-size: 0.8rem;"></i>
                            </label>
                            <input type="file" id="photoInput" accept="image/*" style="display: none;">
                        </div>
                        <h2 id="profileName" style="margin: 0 0 4px; color: var(--text-primary);">—</h2>
                        <p id="profileEmail" style="color: var(--text-tertiary); margin: 0 0 8px;">—</p>
                        <p id="profileRole" style="display: inline-block; padding: 4px 12px; border-radius: 99px; background: rgba(79,70,229,0.12); color: var(--primary-color); font-size: 0.75rem; font-weight: 600; margin: 0;">—</p>
                    </div>

                    <div style="display: grid; gap: 24px;">
                        <!-- Account Information -->
                        <div class="card" style="padding: 20px;">
                            <h3 style="margin-bottom: 20px;"><i class="fas fa-user-edit" style="color: var(--primary-color);"></i> Account Information</h3>
                            <form id="profileForm">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>First Name</label>
                                        <input type="text" id="firstName" required>
                                    </div>
                                    <div class="form-group">
                                        <label>Last Name</label>
                                        <input type="text" id="lastName">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>Email</label>
                                        <input type="email" id="profileEmailInput" disabled style="opacity: 0.7;">
                                    </div>
                                    <div class="form-group">
                                        <label>Phone</label>
                                        <input type="tel" id="phone" placeholder="+91 98765 43210">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Save Changes
                                </button>
                            </form>
                        </div>

                        <!-- Change Password -->
                        <div class="card" style="padding: 20px;">
                            <h3 style="margin-bottom: 20px;"><i class="fas fa-key" style="color: var(--primary-color);"></i> Change Password</h3>
                            <form id="passwordForm">
                                <div class="form-group">
                                    <label>Current Password</label>
                                    <input type="password" id="oldPassword" required>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>New Password</label>
                                        <input type="password" id="newPassword" required placeholder="Min 8 chars, letters & numbers">
                                    </div>
                                    <div class="form-group">
                                        <label>Confirm New Password</label>
                                        <input type="password" id="confirmPassword" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-secondary">
                                    <i class="fas fa-sync"></i> Update Password
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/app_common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ title: 'My Profile', page: 'profile.html', init: initProfile });
        });

        async function initProfile() {
            await loadProfile();
            document.getElementById('profileForm').addEventListener('submit', saveProfile);
            document.getElementById('passwordForm').addEventListener('submit', changePassword);
            document.getElementById('photoInput').addEventListener('change', uploadPhoto);
        }

        async function loadProfile() {
            try {
                const u = await STC.get('user_crud.php', 'profile');
                const fullName = [u.first_name, u.last_name].filter(Boolean).join(' ');
                document.getElementById('profileName').textContent = fullName || u.email || 'User';
                document.getElementById('profileEmail').textContent = u.email || '';
                document.getElementById('profileRole').textContent = (STC.ROLE_LABEL[u.role] || u.role || '').toUpperCase();
                document.getElementById('firstName').value = u.first_name || '';
                document.getElementById('lastName').value = u.last_name || '';
                document.getElementById('profileEmailInput').value = u.email || '';
                document.getElementById('phone').value = u.phone || '';
                if (u.profile_photo) {
                    document.getElementById('avatarImg').src = u.profile_photo;
                }
                if (u.currency) {
                    const cur = document.createElement('span');
                    cur.textContent = ' • ' + u.currency;
                    document.getElementById('profileRole').appendChild(cur);
                }
            } catch (e) {
                STC.showToastError(e.message);
            }
        }

        async function saveProfile(e) {
            e.preventDefault();
            try {
                await STC.post('user_crud.php', 'update_profile', {
                    first_name: document.getElementById('firstName').value,
                    last_name: document.getElementById('lastName').value,
                    phone: document.getElementById('phone').value
                });
                STC.showToastSuccess('Profile updated successfully');
                await loadProfile();
            } catch (err) {
                STC.showToastError(err.message);
            }
        }

        async function changePassword(e) {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            if (newPass !== confirmPass) {
                STC.showToastError('New passwords do not match');
                return;
            }
            try {
                await STC.post('auth.php', 'change_password', {
                    old_password: document.getElementById('oldPassword').value,
                    new_password: newPass
                });
                STC.showToastSuccess('Password changed successfully');
                e.target.reset();
            } catch (err) {
                STC.showToastError(err.message);
            }
        }

        async function uploadPhoto(e) {
            const file = e.target.files[0];
            if (!file) return;
            const fd = new FormData();
            fd.append('profile_photo', file);
            fd.append('csrf_token', getCookie('csrf_token') || '');
            try {
                const res = await fetch(STC.API + 'user_crud.php?action=upload_photo', {
                    method: 'POST',
                    credentials: 'same-origin',
                    body: fd
                });
                const d = await res.json();
                if (!d.success) throw new Error(d.error || 'Upload failed');
                document.getElementById('avatarImg').src = d.data.photo_url || document.getElementById('avatarImg').src;
                STC.showToastSuccess('Photo updated');
            } catch (err) {
                STC.showToastError(err.message);
            }
            e.target.value = '';
        }
    </script>
</body>
</html>
