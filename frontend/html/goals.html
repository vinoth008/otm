<!-- frontend/html/goals.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals - Smart Transaction Control</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-wallet"></i>
                    <span>STC</span>
                </div>
                <button class="sidebar-toggle" id="sidebarClose">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <nav class="sidebar-menu">
                <a href="dashboard.html" class="sidebar-menu-item">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
                <a href="transactions.html" class="sidebar-menu-item">
                    <i class="fas fa-exchange-alt"></i>
                    <span>Transactions</span>
                </a>
                <a href="analytics.html" class="sidebar-menu-item">
                    <i class="fas fa-chart-pie"></i>
                    <span>Analytics</span>
                </a>
                <a href="budget.html" class="sidebar-menu-item">
                    <i class="fas fa-piggy-bank"></i>
                    <span>Budget</span>
                </a>
                <div class="sidebar-divider"></div>
                <div class="sidebar-section-title">Personal</div>
                <a href="profile.html" class="sidebar-menu-item">
                    <i class="fas fa-user"></i>
                    <span>Profile</span>
                </a>
                <a href="goals.html" class="sidebar-menu-item active">
                    <i class="fas fa-bullseye"></i>
                    <span>Goals</span>
                </a>
                <a href="settings.html" class="sidebar-menu-item">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>
                <div class="sidebar-divider"></div>
                <div class="sidebar-section-title">Support</div>
                <a href="help.html" class="sidebar-menu-item">
                    <i class="fas fa-question-circle"></i>
                    <span>Help & FAQ</span>
                </a>
                <a href="#" class="sidebar-menu-item" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="card" style="background: linear-gradient(135deg, #4f46e5, #06b6d4); color: white; padding: 16px;">
                    <div style="font-weight: 600; margin-bottom: 8px;">
                        <i class="fas fa-crown"></i> Upgrade to Pro
                    </div>
                    <p style="font-size: 0.75rem; margin-bottom: 12px; opacity: 0.9;">
                        Get advanced analytics, unlimited goals, and more!
                    </p>
                    <button class="btn btn-sm" style="background: white; color: #4f46e5; border: none;">
                        Upgrade Now
                    </button>
                </div>
            </div>
        </aside>
        <div class="mobile-overlay" id="mobileOverlay"></div>
        <main class="main-content">
            <div class="top-nav">
                <div class="top-nav-left">
                    <button class="sidebar-toggle" id="sidebarToggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div>
                        <h1 class="page-title">Savings Goals</h1>
                        <div class="breadcrumb">
                            <a href="dashboard.html">Home</a>
                            <i class="fas fa-chevron-right" style="font-size: 0.625rem;"></i>
                            <span>Goals</span>
                        </div>
                    </div>
                </div>
                <div class="top-nav-right">
                    <div class="nav-actions">
                        <button class="nav-icon-btn" id="themeToggle" title="Toggle Theme">
                            <i class="fas fa-moon"></i>
                            <i class="fas fa-sun" style="display: none;"></i>
                        </button>
                        <button class="btn btn-primary" onclick="openAddGoalModal()">
                            <i class="fas fa-plus"></i> New Goal
                        </button>
                    </div>
                </div>
            </div>
            <!-- Goals Summary -->
            <div class="dashboard-grid" style="margin-bottom: 24px;">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-card-title">Active Goals</div>
                            <div class="stat-card-value" id="activeGoals">0</div>
                        </div>
                        <div class="stat-card-icon" style="background: rgba(79, 70, 229, 0.1);">
                            <i class="fas fa-bullseye"></i>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-card-title">Total Target</div>
                            <div class="stat-card-value" id="totalTarget">₹0</div>
                        </div>
                        <div class="stat-card-icon" style="background: rgba(6, 182, 212, 0.1);">
                            <i class="fas fa-flag"></i>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-card-title">Total Saved</div>
                            <div class="stat-card-value" id="totalSaved">₹0</div>
                        </div>
                        <div class="stat-card-icon" style="background: rgba(16, 185, 129, 0.1);">
                            <i class="fas fa-piggy-bank"></i>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-header">
                        <div>
                            <div class="stat-card-title">Overall Progress</div>
                            <div class="stat-card-value" id="overallProgress">0%</div>
                        </div>
                        <div class="stat-card-icon" style="background: rgba(245, 158, 11, 0.1);">
                            <i class="fas fa-chart-line"></i>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Goals Grid -->
            <div class="dashboard-grid" id="goalsGrid" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));">
                <!-- Populated by JS -->
            </div>
        </main>
    </div>
    <!-- Add Goal Modal -->
    <div class="modal" id="addGoalModal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h3 class="modal-title">Create New Goal</h3>
                <button class="modal-close" onclick="closeAddGoalModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="addGoalForm">
                    <div class="form-group">
                        <label>Goal Name</label>
                        <input type="text" id="goalName" placeholder="e.g., New Laptop" required>
                    </div>
                    <div class="form-group">
                        <label>Target Amount (₹)</label>
                        <input type="number" id="goalTarget" placeholder="50000" min="1" step="0.01" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Current Amount (₹)</label>
                            <input type="number" id="goalCurrent" placeholder="0" min="0" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>Target Date</label>
                            <input type="date" id="goalDate">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Icon</label>
                        <select id="goalIcon">
                            <option value="fa-car">🚗 Car</option>
                            <option value="fa-home">🏠 House</option>
                            <option value="fa-plane">✈️ Travel</option>
                            <option value="fa-laptop">💻 Electronics</option>
                            <option value="fa-graduation-cap">🎓 Education</option>
                            <option value="fa-heart">❤️ Emergency Fund</option>
                            <option value="fa-gift">🎁 Gift</option>
                            <option value="fa-coins">💰 Investment</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description (Optional)</label>
                        <textarea id="goalDescription" placeholder="Describe your goal..." rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAddGoalModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveGoal()">
                    <i class="fas fa-save"></i> Save Goal
                </button>
            </div>
        </div>
    </div>
    <script src="../js/utils.js"></script>
    <script src="../js/goals.js"></script>
</body>
</html>
