<!-- frontend/html/notes.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - Smart Transaction Control</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div class="content-area" style="padding: 24px;">
                <div class="table-header" style="margin-bottom: 20px;">
                    <div>
                        <h3 class="table-title">My Notes</h3>
                        <p style="font-size: 0.85rem; color: var(--text-secondary);">Keep personal reminders and quick notes.</p>
                    </div>
                    <button class="btn btn-sm btn-primary" id="openAddNoteBtn"><i class="fas fa-plus"></i> New Note</button>
                </div>
                <div id="notesGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;">
                    <div class="text-center" style="padding: 40px;"><div class="spinner"></div></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Note Modal -->
    <div class="modal" id="addNoteModal">
        <div class="modal-content" style="max-width: 520px;">
            <div class="modal-header">
                <h3 class="modal-title">Note</h3>
                <button class="modal-close" onclick="closeModal('addNoteModal'); resetNoteModal();"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="addNoteForm">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="nfTitle" class="form-control" placeholder="Note title">
                    </div>
                    <div class="form-group">
                        <label>Content</label>
                        <textarea id="nfContent" class="form-control" rows="5" placeholder="Write your note here..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Category</label>
                            <select id="nfCategory" class="form-control">
                                <option value="general">General</option>
                                <option value="work">Work</option>
                                <option value="personal">Personal</option>
                                <option value="finance">Finance</option>
                                <option value="idea">Idea</option>
                            </select>
                        </div>
                        <div class="form-group" style="display: flex; align-items: center; gap: 8px; padding-top: 28px;">
                            <input type="checkbox" id="nfPinned" class="role-perm">
                            <label for="nfPinned" style="margin: 0;">Pin note</label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addNoteModal'); resetNoteModal();">Cancel</button>
                <button class="btn btn-primary" id="saveNoteBtn"><i class="fas fa-save"></i> Save Note</button>
            </div>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/app_common.js"></script>
    <script src="../js/banking.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ roles: ['customer'], title: 'Notes', page: 'notes.html', init: initNotes });
        });
    </script>
</body>
</html>
