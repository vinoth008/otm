<!-- frontend/html/beneficiaries.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beneficiaries - Smart Transaction Control</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div class="content-area" style="padding: 24px;">
                <div class="card" style="padding: 20px; margin-bottom: 20px;">
                    <div class="table-header">
                        <div>
                            <h3 class="table-title">Saved Beneficiaries</h3>
                            <p style="font-size: 0.85rem; color: var(--text-secondary);">Keep your frequently-used accounts handy for quick transfers.</p>
                        </div>
                        <button class="btn btn-sm btn-primary" id="openAddBeneficiaryBtn"><i class="fas fa-plus"></i> Add Beneficiary</button>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Nickname</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Bank</th>
                                    <th>Account No</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="beneficiaryTableBody">
                                <tr><td colspan="7" class="text-center"><div class="spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Beneficiary Modal -->
    <div class="modal" id="addBeneficiaryModal">
        <div class="modal-content" style="max-width: 520px;">
            <div class="modal-header">
                <h3 class="modal-title">Add Beneficiary</h3>
                <button class="modal-close" onclick="closeModal('addBeneficiaryModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="addBeneficiaryForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" id="bfName" class="form-control" placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label>Nickname</label>
                            <input type="text" id="bfNickname" class="form-control" placeholder="Dad">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="bfEmail" class="form-control" placeholder="john@example.com">
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="text" id="bfPhone" class="form-control" placeholder="9876543210">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Bank Name</label>
                            <input type="text" id="bfBankName" class="form-control" placeholder="HDFC Bank">
                        </div>
                        <div class="form-group">
                            <label>Account Number *</label>
                            <input type="text" id="bfAccountNumber" class="form-control" placeholder="Account number">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>IFSC Code</label>
                        <input type="text" id="bfIfsc" class="form-control" placeholder="HDFC0001234">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addBeneficiaryModal')">Cancel</button>
                <button class="btn btn-primary" id="saveBeneficiaryBtn"><i class="fas fa-save"></i> Add Beneficiary</button>
            </div>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/app_common.js"></script>
    <script src="../js/banking.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ roles: ['customer'], title: 'Beneficiaries', page: 'beneficiaries.html', init: initBeneficiaries });
        });
    </script>
</body>
</html>
