<!-- frontend/html/auditor/dashboard.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Auditor | Smart Transaction Control</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div class="content-area" style="padding: 24px;">
                <!-- Read-only banner -->
                <div class="card" style="padding: 14px 20px; margin-bottom: 20px; background: rgba(139,92,246,0.08); border-left: 4px solid #8b5cf6;">
                    <p style="margin: 0; font-size: 0.85rem; color: #8b5cf6;">
                        <i class="fas fa-eye"></i> <strong>Read-Only Mode:</strong> You have viewing and export access only. Editing is disabled for auditors.
                    </p>
                </div>

                <!-- Stat Cards -->
                <div class="stat-grid" id="statGrid">
                    <div class="card stat-card">
                        <div class="stat-icon" style="background: rgba(139,92,246,0.15); color: #8b5cf6;">
                            <i class="fas fa-exchange-alt"></i>
                        </div>
                        <div class="stat-details">
                            <span class="stat-label">Total Transactions</span>
                            <span class="stat-value" id="statTxns">0</span>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon" style="background: rgba(16,185,129,0.15); color: #10b981;">
                            <i class="fas fa-arrow-down"></i>
                        </div>
                        <div class="stat-details">
                            <span class="stat-label">Total Income</span>
                            <span class="stat-value" id="statIncome">₹0.00</span>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon" style="background: rgba(239,68,68,0.15); color: #ef4444;">
                            <i class="fas fa-arrow-up"></i>
                        </div>
                        <div class="stat-details">
                            <span class="stat-label">Total Expense</span>
                            <span class="stat-value" id="statExpense">₹0.00</span>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon" style="background: rgba(6,182,212,0.15); color: #06b6d4;">
                            <i class="fas fa-balance-scale"></i>
                        </div>
                        <div class="stat-details">
                            <span class="stat-label">Net Balance</span>
                            <span class="stat-value" id="statNet">₹0.00</span>
                        </div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                    <!-- Trend Chart -->
                    <div class="card" style="padding: 20px;">
                        <h3 class="card-title">Transaction Health</h3>
                        <div style="height: 300px; position: relative;">
                            <canvas id="healthChart"></canvas>
                        </div>
                    </div>
                    <!-- Audit Logs -->
                    <div class="card" style="padding: 20px;">
                        <h3 class="card-title">Recent Audit Logs</h3>
                        <div class="table-container" style="max-height: 300px; overflow-y: auto;">
                            <table class="table table-sm">
                                <thead>
                                    <tr>
                                        <th>Time</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="auditBody">
                                    <tr><td colspan="2" class="text-center"><div class="spinner spinner-sm"></div></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Recent Transactions -->
                <div class="card" style="padding: 20px; margin-top: 20px;">
                    <div class="table-header">
                        <h3 class="table-title">Recent Transactions</h3>
                        <a href="../transactions.html" class="btn btn-sm btn-secondary"><i class="fas fa-eye"></i> View All</a>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Type</th>
                                    <th>Category</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="recentTxnBody">
                                <tr><td colspan="6" class="text-center"><div class="spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/utils.js"></script>
    <script src="../../js/app_common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ roles: ['auditor'], title: 'Auditor Dashboard', page: 'dashboard.html', init: initAuditorDash });
        });

        async function initAuditorDash(s) {
            try {
                const stats = await STC.get('admin_crud.php', 'get_stats');
                document.getElementById('statTxns').textContent = Number(stats.total_transactions || 0).toLocaleString('en-IN');
                document.getElementById('statIncome').textContent = '₹' + Number(stats.total_income || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 });
                document.getElementById('statExpense').textContent = '₹' + Number(stats.total_expense || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 });
                document.getElementById('statNet').textContent = '₹' + Number(stats.net_income || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 });

                const healthCtx = document.getElementById('healthChart');
                if (healthCtx) {
                    new Chart(healthCtx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Income', 'Expense', 'Pending'],
                            datasets: [{
                                data: [
                                    Number(stats.total_income || 0),
                                    Number(stats.total_expense || 0),
                                    Number(stats.pending_expenses || 0)
                                ],
                                backgroundColor: ['#10b981', '#ef4444', '#f59e0b'],
                                borderWidth: 0
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
                    });
                }
            } catch (e) {
                console.error(e);
            }

            try {
                const data = await STC.get('transaction_crud.php', 'get_all', { limit: 5 });
                const tbody = document.getElementById('recentTxnBody');
                const txns = data.transactions || data || [];
                const list = Array.isArray(txns) ? txns : [];
                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No transactions found</td></tr>';
                } else {
                    tbody.innerHTML = list.map(t => `
                        <tr>
                            <td>${STC.esc(t.transaction_date || t.date || '')}</td>
                            <td><span class="badge ${t.type === 'income' ? 'badge-success' : 'badge-danger'}">${STC.esc(t.type || '')}</span></td>
                            <td>${STC.esc(t.category || '')}</td>
                            <td>${STC.esc(t.description || '')}</td>
                            <td class="text-bold">₹${Number(t.amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
                            <td>${STC.badge(t.status)}</td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                console.error(e);
                document.getElementById('recentTxnBody').innerHTML = '<tr><td colspan="6" class="text-center text-muted">Failed to load</td></tr>';
            }

            try {
                const data = await STC.get('audit_crud.php', 'get_logs');
                const tbody = document.getElementById('auditBody');
                const logs = data.logs || [];
                const list = Array.isArray(logs) ? logs.slice(0, 5) : [];
                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">No audit logs</td></tr>';
                } else {
                    tbody.innerHTML = list.map(l => `
                        <tr>
                            <td>${STC.esc(l.timestamp || l.created_at || '')}</td>
                            <td><span class="badge badge-info">${STC.esc(l.action || '')}</span></td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                console.error(e);
                document.getElementById('auditBody').innerHTML = '<tr><td colspan="2" class="text-center text-muted">No audit logs</td></tr>';
            }
        }
    </script>
</body>
</html>
