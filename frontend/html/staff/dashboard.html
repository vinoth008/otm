<!-- frontend/html/staff/dashboard.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Smart Transaction Control</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/mini_theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div id="dashboardContent">
                <div id="dashboardLoading" class="loading-overlay">
                    <div class="spinner spinner-lg"></div>
                </div>
                <div id="dashboardGrid" style="display: none;">
                    <div class="dashboard-grid">
                        <div class="stat-card income">
                            <div class="stat-card-header">
                                <div>
                                    <div class="stat-card-title">Customers</div>
                                    <div class="stat-card-value" id="staffTotalCustomers">0</div>
                                </div>
                                <div class="stat-card-icon"><i class="fas fa-users"></i></div>
                            </div>
                            <div class="stat-card-change positive"><i class="fas fa-user-plus"></i><span id="staffCustomerLine"></span></div>
                        </div>
                        <div class="stat-card expense">
                            <div class="stat-card-header">
                                <div>
                                    <div class="stat-card-title">Pending Transfers</div>
                                    <div class="stat-card-value" id="staffPendingTransfers">0</div>
                                </div>
                                <div class="stat-card-icon"><i class="fas fa-paper-plane"></i></div>
                            </div>
                            <div class="stat-card-change negative"><i class="fas fa-clock"></i><span id="staffTransferLine"></span></div>
                        </div>
                        <div class="stat-card savings">
                            <div class="stat-card-header">
                                <div>
                                    <div class="stat-card-title">Open Complaints</div>
                                    <div class="stat-card-value" id="staffOpenComplaints">0</div>
                                </div>
                                <div class="stat-card-icon"><i class="fas fa-headset"></i></div>
                            </div>
                            <div class="stat-card-change positive"><i class="fas fa-check-circle"></i><span id="staffComplaintLine"></span></div>
                        </div>
                        <div class="stat-card balance">
                            <div class="stat-card-header">
                                <div>
                                    <div class="stat-card-title">Today's Appointments</div>
                                    <div class="stat-card-value" id="staffTodayAppointments">0</div>
                                </div>
                                <div class="stat-card-icon"><i class="fas fa-calendar-check"></i></div>
                            </div>
                            <div class="stat-card-change"><span id="staffAppointmentLine"></span></div>
                        </div>
                    </div>
                    <div class="transactions-card">
                        <div class="table-header">
                            <h3 class="table-title">Recent Transfer Requests</h3>
                            <div class="table-actions">
                                <button class="btn btn-sm btn-outline" onclick="window.location.href='transfers.html'">View All</button>
                            </div>
                        </div>
                        <div class="table-container">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Created</th>
                                        <th>Type</th>
                                        <th>Amount</th>
                                        <th>Description</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="staffRecentTable">
                                    <tr><td colspan="5" class="text-center"><div class="spinner"></div></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="dashboard-grid" style="grid-template-columns: repeat(4, 1fr); gap: 16px;">
                        <div class="card" style="text-align: center; cursor: pointer;" onclick="window.location.href='receipts.html'">
                            <div style="width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-receipt" style="font-size: 1.5rem; color: var(--primary-color);"></i>
                            </div>
                            <h4 style="margin-bottom: 8px;">Issue Receipt</h4>
                            <p style="font-size: 0.875rem;">Generate payment receipts</p>
                        </div>
                        <div class="card" style="text-align: center; cursor: pointer;" onclick="window.location.href='expenses.html'">
                            <div style="width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-file-invoice-dollar" style="font-size: 1.5rem; color: var(--primary-color);"></i>
                            </div>
                            <h4 style="margin-bottom: 8px;">Record Expense</h4>
                            <p style="font-size: 0.875rem;">Log operational costs</p>
                        </div>
                        <div class="card" style="text-align: center; cursor: pointer;" onclick="window.location.href='appointments.html'">
                            <div style="width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-calendar-check" style="font-size: 1.5rem; color: var(--primary-color);"></i>
                            </div>
                            <h4 style="margin-bottom: 8px;">Appointments</h4>
                            <p style="font-size: 0.875rem;">Manage branch visits</p>
                        </div>
                        <div class="card" style="text-align: center; cursor: pointer;" onclick="window.location.href='complaints.html'">
                            <div style="width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-headset" style="font-size: 1.5rem; color: var(--primary-color);"></i>
                            </div>
                            <h4 style="margin-bottom: 8px;">Complaints</h4>
                            <p style="font-size: 0.875rem;">Resolve support tickets</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/utils.js"></script>
    <script src="../js/app_common.js"></script>
    <script src="../js/staff.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ roles: ['staff'], title: 'Staff Dashboard', page: 'dashboard.html', init: initStaffDashboard });
        });
    </script>
</body>
</html>
