<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Staff | Smart Transaction Control</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div class="content-area" style="padding: 24px;">
                <div class="card" style="padding: 20px; margin-bottom: 20px;">
                    <div class="table-header" style="flex-wrap: wrap; gap: 12px;">
                        <div>
                            <h3 class="table-title">Customers</h3>
                            <p style="font-size: 0.85rem; color: var(--text-secondary);">View and manage customer accounts.</p>
                        </div>
                        <div class="table-actions" style="display: flex; gap: 8px;">
                            <input type="text" id="customerSearch" class="form-control" placeholder="Search customers..." style="width: auto;">
                            <button class="btn btn-sm btn-primary" id="openAddCustomerBtn"><i class="fas fa-plus"></i> Add Customer</button>
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Status</th>
                                    <th>Joined</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="staffCustomerTableBody">
                                <tr><td colspan="6" class="text-center"><div class="spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Customer Modal -->
    <div class="modal" id="addCustomerModal">
        <div class="modal-content" style="max-width: 520px;">
            <div class="modal-header">
                <h3 class="modal-title">Add New Customer</h3>
                <button class="modal-close" onclick="closeModal('addCustomerModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="addCustomerForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" id="scFirstName" class="form-control" placeholder="John">
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" id="scLastName" class="form-control" placeholder="Doe">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="scEmail" class="form-control" placeholder="customer@example.com">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="scPhone" class="form-control" placeholder="9876543210">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="scPassword" class="form-control" placeholder="Min 8 chars with letters, numbers & symbols">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addCustomerModal')">Cancel</button>
                <button class="btn btn-primary" id="saveCustomerBtn"><i class="fas fa-save"></i> Create Customer</button>
            </div>
        </div>
    </div>

    <script src="../../js/utils.js"></script>
    <script src="../../js/app_common.js"></script>
    <script src="../../js/staff.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ roles: ['staff'], title: 'Customers', page: 'customers.html', init: initStaffCustomers });
        });
    </script>
</body>
</html>
