<!-- frontend/html/appointments.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Smart Transaction Control</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div class="content-area" style="padding: 24px;">
                <div class="dashboard-grid" style="grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px;">
                    <div class="stat-card income">
                        <div class="stat-card-header">
                            <div>
                                <div class="stat-card-title">Upcoming</div>
                                <div class="stat-card-value" id="appUpcoming">0</div>
                            </div>
                            <div class="stat-card-icon"><i class="fas fa-calendar-check"></i></div>
                        </div>
                    </div>
                    <div class="stat-card expense">
                        <div class="stat-card-header">
                            <div>
                                <div class="stat-card-title">Completed</div>
                                <div class="stat-card-value" id="appCompleted">0</div>
                            </div>
                            <div class="stat-card-icon"><i class="fas fa-check-circle"></i></div>
                        </div>
                    </div>
                    <div class="stat-card balance">
                        <div class="stat-card-header">
                            <div>
                                <div class="stat-card-title">Cancelled</div>
                                <div class="stat-card-value" id="appCancelled">0</div>
                            </div>
                            <div class="stat-card-icon"><i class="fas fa-times-circle"></i></div>
                        </div>
                    </div>
                </div>
                <div class="card" style="padding: 20px;">
                    <div class="table-header">
                        <div>
                            <h3 class="table-title">My Appointments</h3>
                            <p style="font-size: 0.85rem; color: var(--text-secondary);">Schedule visits with our branches.</p>
                        </div>
                        <button class="btn btn-sm btn-primary" id="openAppointmentBtn"><i class="fas fa-plus"></i> Book Appointment</button>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Time</th>
                                    <th>Purpose</th>
                                    <th>Notes</th>
                                    <th>Status</th>
                                    <th>Booked</th>
                                </tr>
                            </thead>
                            <tbody id="appointmentTableBody">
                                <tr><td colspan="6" class="text-center"><div class="spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Book Appointment Modal -->
    <div class="modal" id="addAppointmentModal">
        <div class="modal-content" style="max-width: 520px;">
            <div class="modal-header">
                <h3 class="modal-title">Book Appointment</h3>
                <button class="modal-close" onclick="closeModal('addAppointmentModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="addAppointmentForm">
                    <div class="form-group">
                        <label>Purpose / Service</label>
                        <select id="apPurpose" class="form-control">
                            <option value="Account Opening">Account Opening</option>
                            <option value="Loan Application">Loan Application</option>
                            <option value="Card Services">Card Services</option>
                            <option value="Investment Advice">Investment Advice</option>
                            <option value="General Inquiry">General Inquiry</option>
                            <option value="Complaint Resolution">Complaint Resolution</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="apDate" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Time</label>
                            <input type="time" id="apTime" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Branch</label>
                        <select id="apBranch" class="form-control"><option value="">Loading branches...</option></select>
                    </div>
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="apNotes" class="form-control" rows="3" placeholder="Anything we should know?"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addAppointmentModal')">Cancel</button>
                <button class="btn btn-primary" id="saveAppointmentBtn"><i class="fas fa-calendar-check"></i> Book</button>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/app_common.js"></script>
    <script src="js/banking.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ roles: ['customer'], title: 'Appointments', page: 'appointments.html', init: initAppointments });
        });
    </script>
</body>
</html>
