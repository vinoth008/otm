<!-- frontend/html/wallet.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Smart Transaction Control</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div class="content-area" style="padding: 24px;">
                <div class="card" style="padding: 24px; margin-bottom: 20px; background: linear-gradient(135deg, #4f46e5, #06b6d4); color: white;">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
                        <div>
                            <div style="font-size: 0.85rem; opacity: 0.85; margin-bottom: 4px;">Wallet Balance</div>
                            <div style="font-size: 2.25rem; font-weight: 700;" id="walletBalance">₹0.00</div>
                            <div style="font-size: 0.8rem; opacity: 0.85; margin-top: 4px;">Currency: <span id="walletCurrency">INR</span></div>
                        </div>
                        <div style="display: flex; gap: 16px; text-align: center;">
                            <div style="background: rgba(255,255,255,0.15); padding: 12px 20px; border-radius: var(--radius-md);">
                                <div style="font-size: 1.4rem; font-weight: 700;" id="walletIncoming">0</div>
                                <div style="font-size: 0.75rem; opacity: 0.9;">Incoming</div>
                            </div>
                            <div style="background: rgba(255,255,255,0.15); padding: 12px 20px; border-radius: var(--radius-md);">
                                <div style="font-size: 1.4rem; font-weight: 700;" id="walletOutgoing">0</div>
                                <div style="font-size: 0.75rem; opacity: 0.9;">Outgoing</div>
                            </div>
                        </div>
                        <button class="btn" style="background: white; color: #4f46e5; border: none;" id="openTopupBtn">
                            <i class="fas fa-plus"></i> Top Up Wallet
                        </button>
                    </div>
                </div>

                <div class="card" style="padding: 20px; margin-bottom: 20px;">
                    <div class="table-header">
                        <div>
                            <h3 class="table-title">Send Money</h3>
                            <p style="font-size: 0.85rem; color: var(--text-secondary);">Transfer instantly from your wallet to another user.</p>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Recipient Email</label>
                            <input type="email" id="walletRecipientEmail" class="form-control" placeholder="friend@example.com">
                        </div>
                        <div class="form-group">
                            <label>Amount</label>
                            <input type="number" id="walletTransferAmount" class="form-control" placeholder="0.00" min="0.01" step="0.01">
                        </div>
                        <div class="form-group">
                            <label>Note (optional)</label>
                            <input type="text" id="walletTransferDescription" class="form-control" placeholder="What is it for?">
                        </div>
                        <div class="form-group" style="display: flex; align-items: flex-end;">
                            <button class="btn btn-primary" id="walletSendBtn"><i class="fas fa-paper-plane"></i> Send</button>
                        </div>
                    </div>
                </div>

                <div class="card" style="padding: 20px;">
                    <div class="table-header">
                        <h3 class="table-title">Wallet Activity</h3>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Type</th>
                                    <th>Direction</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="walletHistoryTable">
                                <tr><td colspan="6" class="text-center"><div class="spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Top Up Modal -->
    <div class="modal" id="topupModal">
        <div class="modal-content" style="max-width: 440px;">
            <div class="modal-header">
                <h3 class="modal-title">Top Up Wallet</h3>
                <button class="modal-close" onclick="closeModal('topupModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="topupForm">
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" id="topupAmount" class="form-control" placeholder="0.00" min="0.01" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Description (optional)</label>
                        <input type="text" id="topupDescription" class="form-control" placeholder="e.g. Added via debit card">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('topupModal')">Cancel</button>
                <button class="btn btn-primary" id="saveTopupBtn"><i class="fas fa-check"></i> Add Funds</button>
            </div>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/app_common.js"></script>
    <script src="../js/banking.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ roles: ['customer'], title: 'Wallet', page: 'wallet.html', init: initWallet });
        });
    </script>
</body>
</html>
