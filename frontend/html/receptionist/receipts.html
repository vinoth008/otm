<!-- frontend/html/receptionist/receipts.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipts - Receptionist | Smart Transaction Control</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div class="content-area" style="padding: 24px;">
                <div class="card" style="padding: 20px; margin-bottom: 20px;">
                    <div class="table-header">
                        <div>
                            <h3 class="table-title">Receipts</h3>
                            <p style="font-size: 0.85rem; color: var(--text-secondary);">Issue and view payment receipts.</p>
                        </div>
                        <button class="btn btn-sm btn-primary" onclick="recIssueReceipt('')"><i class="fas fa-plus"></i> Issue Receipt</button>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Issued</th>
                                    <th>Receipt No</th>
                                    <th>Customer</th>
                                    <th>Amount</th>
                                    <th>Method</th>
                                    <th>Description</th>
                                </tr>
                            </thead>
                            <tbody id="recReceiptTableBody">
                                <tr><td colspan="6" class="text-center"><div class="spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Create Receipt Modal -->
    <div class="modal" id="createReceiptModal">
        <div class="modal-content" style="max-width: 480px;">
            <div class="modal-header">
                <h3 class="modal-title">Issue Receipt</h3>
                <button class="modal-close" onclick="closeModal('createReceiptModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="createReceiptForm">
                    <div class="form-group">
                        <label>Customer ID</label>
                        <input type="text" id="rrUserId" class="form-control" placeholder="Paste customer ID">
                    </div>
                    <div class="form-group">
                        <label>Amount</label>
                        <input type="number" id="rrAmount" class="form-control" placeholder="0.00" min="0.01" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select id="rrPaymentMethod" class="form-control">
                            <option value="cash">Cash</option>
                            <option value="card">Card</option>
                            <option value="upi">UPI</option>
                            <option value="bank_transfer">Bank Transfer</option>
                            <option value="wallet">Wallet</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" id="rrDescription" class="form-control" placeholder="What is this payment for?">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('createReceiptModal')">Cancel</button>
                <button class="btn btn-primary" id="saveReceiptBtn"><i class="fas fa-receipt"></i> Generate Receipt</button>
            </div>
        </div>
    </div>

    <script src="../../js/utils.js"></script>
    <script src="../../js/app_common.js"></script>
    <script src="../../js/receptionist.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ roles: ['receptionist'], title: 'Receipts', page: 'receipts.html', init: initReceptionistReceipts });
        });
    </script>
</body>
</html>
