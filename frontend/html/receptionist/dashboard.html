<!-- frontend/html/receptionist/dashboard.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptionist Dashboard - Smart Transaction Control</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/mini_theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div id="dashboardContent">
                <div id="dashboardLoading" class="loading-overlay">
                    <div class="spinner spinner-lg"></div>
                </div>
                <div id="dashboardGrid" style="display: none;">
                    <div class="dashboard-grid">
                        <div class="stat-card income">
                            <div class="stat-card-header">
                                <div>
                                    <div class="stat-card-title">Today's Appointments</div>
                                    <div class="stat-card-value" id="recTodayAppointments">0</div>
                                </div>
                                <div class="stat-card-icon"><i class="fas fa-calendar-day"></i></div>
                            </div>
                            <div class="stat-card-change positive"><i class="fas fa-calendar"></i><span id="recTodayLine"></span></div>
                        </div>
                        <div class="stat-card expense">
                            <div class="stat-card-header">
                                <div>
                                    <div class="stat-card-title">Pending Confirmations</div>
                                    <div class="stat-card-value" id="recPendingAppointments">0</div>
                                </div>
                                <div class="stat-card-icon"><i class="fas fa-clock"></i></div>
                            </div>
                            <div class="stat-card-change negative"><i class="fas fa-list"></i><span id="recPendingLine"></span></div>
                        </div>
                        <div class="stat-card savings">
                            <div class="stat-card-header">
                                <div>
                                    <div class="stat-card-title">Receipts Issued</div>
                                    <div class="stat-card-value" id="recReceiptsIssued">0</div>
                                </div>
                                <div class="stat-card-icon"><i class="fas fa-receipt"></i></div>
                            </div>
                            <div class="stat-card-change positive"><i class="fas fa-check-circle"></i><span id="recReceiptsLine"></span></div>
                        </div>
                        <div class="stat-card balance">
                            <div class="stat-card-header">
                                <div>
                                    <div class="stat-card-title">Total Appointments</div>
                                    <div class="stat-card-value" id="recTotalAppointments">0</div>
                                </div>
                                <div class="stat-card-icon"><i class="fas fa-calendar-check"></i></div>
                            </div>
                            <div class="stat-card-change"><span id="recTotalLine"></span></div>
                        </div>
                    </div>
                    <div class="transactions-card">
                        <div class="table-header">
                            <h3 class="table-title">Upcoming Appointments</h3>
                            <div class="table-actions">
                                <button class="btn btn-sm btn-outline" onclick="window.location.href='appointments.html'">View All</button>
                            </div>
                        </div>
                        <div class="table-container">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Time</th>
                                        <th>Purpose</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="recAppointmentTable">
                                    <tr><td colspan="5" class="text-center"><div class="spinner"></div></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../js/utils.js"></script>
    <script src="../js/app_common.js"></script>
    <script src="../js/receptionist.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ roles: ['receptionist'], title: 'Receptionist Desk', page: 'dashboard.html', init: initReceptionistDashboard });
        });
    </script>
</body>
</html>
