<!-- frontend/html/manager/dashboard.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Manager | Smart Transaction Control</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/animations.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-layout">
        <main class="main-content">
            <div class="content-area" style="padding: 24px;">
                <!-- Stat Cards -->
                <div class="stat-grid" id="statGrid">
                    <div class="card stat-card">
                        <div class="stat-icon" style="background: rgba(6,182,212,0.15); color: #06b6d4;">
                            <i class="fas fa-file-invoice-dollar"></i>
                        </div>
                        <div class="stat-details">
                            <span class="stat-label">Total Department Expenses</span>
                            <span class="stat-value" id="statTotal">₹0.00</span>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon" style="background: rgba(245,158,11,0.15); color: #f59e0b;">
                            <i class="fas fa-clipboard-list"></i>
                        </div>
                        <div class="stat-details">
                            <span class="stat-label">Pending Approval</span>
                            <span class="stat-value" id="statPending">0</span>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon" style="background: rgba(16,185,129,0.15); color: #10b981;">
                            <i class="fas fa-check-double"></i>
                        </div>
                        <div class="stat-details">
                            <span class="stat-label">Approved</span>
                            <span class="stat-value" id="statApproved">₹0.00</span>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon" style="background: rgba(239,68,68,0.15); color: #ef4444;">
                            <i class="fas fa-times-circle"></i>
                        </div>
                        <div class="stat-details">
                            <span class="stat-label">Rejected</span>
                            <span class="stat-value" id="statRejected">₹0.00</span>
                        </div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                    <!-- Trend Chart -->
                    <div class="card" style="padding: 20px;">
                        <h3 class="card-title">Department Expense Trend</h3>
                        <div style="height: 300px; position: relative;">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>
                    <!-- Category Breakdown -->
                    <div class="card" style="padding: 20px;">
                        <h3 class="card-title">Expenses by Category</h3>
                        <div style="height: 300px; position: relative;">
                            <canvas id="categoryChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Pending Approvals -->
                <div class="card" style="padding: 20px; margin-top: 20px;">
                    <div class="table-header">
                        <h3 class="table-title">Pending Approvals</h3>
                        <a href="expenses.html" class="btn btn-sm btn-secondary"><i class="fas fa-eye"></i> View All</a>
                    </div>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Employee</th>
                                    <th>Category</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="pendingBody">
                                <tr><td colspan="6" class="text-center"><div class="spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../../js/utils.js"></script>
    <script src="../../js/app_common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            STC.boot({ roles: ['manager'], title: 'Manager Dashboard', page: 'dashboard.html', init: initManagerDash });
        });

        async function initManagerDash(s) {
            try {
                const stats = await STC.get('expense_crud.php', 'stats', { period: 'month' });
                document.getElementById('statTotal').textContent = '₹' + Number(stats.total_expense || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 });
                document.getElementById('statPending').textContent = Number(stats.pending_count || 0).toLocaleString('en-IN');
                document.getElementById('statApproved').textContent = '₹' + Number(stats.approved || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 });
                document.getElementById('statRejected').textContent = '₹' + Number(stats.rejected || 0).toLocaleString('en-IN', { minimumFractionDigits: 2 });

                // Trend (Line)
                const trends = stats.daily_trend || [];
                const trendCtx = document.getElementById('trendChart');
                if (trendCtx) {
                    new Chart(trendCtx, {
                        type: 'line',
                        data: {
                            labels: trends.map(t => t.date),
                            datasets: [{
                                label: 'Expenses',
                                data: trends.map(t => t.total),
                                borderColor: '#06b6d4',
                                backgroundColor: 'rgba(6,182,212,0.1)',
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                    });
                }

                // Category (Bar)
                const cats = stats.category_breakdown || [];
                const catCtx = document.getElementById('categoryChart');
                if (catCtx) {
                    new Chart(catCtx, {
                        type: 'bar',
                        data: {
                            labels: cats.map(c => c.category),
                            datasets: [{
                                label: 'Amount',
                                data: cats.map(c => c.total),
                                backgroundColor: '#4f46e5',
                                borderRadius: 6
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                    });
                }
            } catch (e) {
                console.error(e);
            }

            try {
                const data = await STC.get('expense_crud.php', 'get_all', { status: 'pending', limit: 5 });
                const tbody = document.getElementById('pendingBody');
                if (!data.expenses || data.expenses.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No pending approvals</td></tr>';
                } else {
                    tbody.innerHTML = data.expenses.map(e => `
                        <tr>
                            <td>${STC.esc(e.expense_date)}</td>
                            <td>${STC.esc(e.user_name || '')}</td>
                            <td>${STC.esc(e.category)}</td>
                            <td>${STC.esc(e.description)}</td>
                            <td class="text-bold">₹${Number(e.amount).toLocaleString('en-IN', { minimumFractionDigits: 2 })}</td>
                            <td>
                                <button class="btn btn-sm btn-success" onclick="approveExpense('${e.expense_id}')"><i class="fas fa-check"></i></button>
                                <button class="btn btn-sm btn-danger" onclick="rejectExpense('${e.expense_id}')"><i class="fas fa-times"></i></button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (e) {
                console.error(e);
                document.getElementById('pendingBody').innerHTML = '<tr><td colspan="6" class="text-center text-muted">Failed to load</td></tr>';
            }
        }

        async function approveExpense(id) {
            if (!confirm('Approve this expense?')) return;
            try {
                await STC.post('expense_crud.php', 'update_status', { expense_id: id, status: 'approved' });
                showToast('Expense approved', 'success');
                location.reload();
            } catch (e) {
                showToast(e.message || 'Failed to approve', 'error');
            }
        }

        async function rejectExpense(id) {
            const reason = prompt('Reason for rejection:');
            if (reason === null) return;
            try {
                await STC.post('expense_crud.php', 'update_status', { expense_id: id, status: 'rejected', rejection_reason: reason });
                showToast('Expense rejected', 'warning');
                location.reload();
            } catch (e) {
                showToast(e.message || 'Failed to reject', 'error');
            }
        }
    </script>
</body>
</html>
