<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Complaints — SecureSOT Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../assets/css/style.css"/>
  <link rel="stylesheet" href="../assets/css/dashboard.css"/>
  <link href="../css/app_theme.css" rel="stylesheet">
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div><div class="brand-text"><h3>SecureSOT</h3><span>Admin Panel</span></div></div>
    <nav class="sidebar-nav">
      <span class="nav-section-label">Main</span>
      <a class="nav-link-custom" href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a class="nav-link-custom" href="users.html"><i class="fa-solid fa-users"></i> Users</a>
      <a class="nav-link-custom" href="transactions.html"><i class="fa-solid fa-arrow-right-arrow-left"></i> Transactions</a>
      <a class="nav-link-custom" href="expenses.html"><i class="fa-solid fa-wallet"></i> Expenses</a>
      <span class="nav-section-label">Reports</span>
      <a class="nav-link-custom" href="reports.html"><i class="fa-solid fa-chart-bar"></i> Reports</a>
      <a class="nav-link-custom active" href="complaints.html"><i class="fa-solid fa-comment-dots"></i> Complaints</a>
      <a class="nav-link-custom" href="notifications.html"><i class="fa-solid fa-bell"></i> Notifications</a>
      <span class="nav-section-label">System</span>
      <a class="nav-link-custom" href="audit-logs.html"><i class="fa-solid fa-clipboard-list"></i> Audit Logs</a>
      <a class="nav-link-custom" href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user"><div class="avatar" data-user-avatar>AU</div><div class="user-info"><div class="user-name" data-user-name>Admin</div><span class="user-role">Administrator</span></div></div>
      <button class="btn-logout" data-logout><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebar-toggle"><i class="fa-solid fa-bars"></i></button>
        <div><div style="font-weight:700">Complaints</div><div style="font-size:0.75rem;color:var(--text-muted)">Manage customer complaints</div></div>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" id="themeBtn"><i class="fa-solid fa-moon"></i></button>
        <button class="topbar-btn"><i class="fa-solid fa-bell"></i><span class="notif-dot"></span></button>
        <div class="topbar-profile"><div class="avatar" data-user-avatar>AU</div></div>
      </div>
    </header>
    <div class="page-body">
      <div class="grid-4 mb-4">
        <div class="stat-card"><div class="stat-icon red"><i class="fa-solid fa-circle-exclamation"></i></div><div class="stat-info"><div class="stat-value">3</div><div class="stat-label">Critical</div></div></div>
        <div class="stat-card"><div class="stat-icon orange"><i class="fa-solid fa-clock"></i></div><div class="stat-info"><div class="stat-value">12</div><div class="stat-label">Open</div></div></div>
        <div class="stat-card"><div class="stat-icon cyan"><i class="fa-solid fa-rotate"></i></div><div class="stat-info"><div class="stat-value">8</div><div class="stat-label">In Progress</div></div></div>
        <div class="stat-card"><div class="stat-icon green"><i class="fa-solid fa-check-circle"></i></div><div class="stat-info"><div class="stat-value">47</div><div class="stat-label">Resolved</div></div></div>
      </div>
      <div class="card">
        <div class="card-header-custom">
          <span class="card-title">All Complaints</span>
          <div class="flex gap-2">
            <select class="form-control-custom" style="width:auto;padding:6px 10px;font-size:0.78rem" id="cmpFilter" onchange="filterComplaints()">
              <option value="">All Status</option><option>Open</option><option>In Progress</option><option>Resolved</option><option>Critical</option>
            </select>
          </div>
        </div>
        <table class="table-custom">
          <thead><tr><th>ID</th><th>Customer</th><th>Subject</th><th>Priority</th><th>Status</th><th>Date</th><th>Action</th></tr></thead>
          <tbody id="complaints-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script>
let allComplaints=[];
const sc={Critical:'badge-danger',Open:'badge-warning','In Progress':'badge-info',Resolved:'badge-success'};
const pc={High:'badge-danger',Medium:'badge-warning',Low:'badge-info'};

function renderComplaints(list){
  document.getElementById('complaints-body').innerHTML=list.map(c=>`<tr>
    <td><code style="color:var(--primary-light);font-size:0.8rem">${c.ticket_no}</code></td>
    <td>${c.customer_name}</td>
    <td>${c.subject}</td>
    <td><span class="badge-custom ${pc[c.priority]||'badge-info'}">${c.priority}</span></td>
    <td><span class="badge-custom ${sc[c.status]||'badge-warning'}">${c.status}</span></td>
    <td>${c.created_at}</td>
    <td>
      <button class="btn-success-custom" style="margin-right:4px" onclick="resolveComplaint('${c._id}')"><i class="fa-solid fa-check"></i></button>
      <button class="btn-secondary-custom" style="padding:6px 10px;font-size:0.75rem" onclick="viewComplaint('${c._id}')"><i class="fa-solid fa-eye"></i></button>
    </td>
  </tr>`).join('');
}
function loadComplaints(){
  apiGet('?module=complaints&action=get_all').then(res=>{
    allComplaints=res.data.complaints||[];
    updateStats();
    renderComplaints(allComplaints);
  }).catch(err=>showToast(err.message||'Failed to load complaints','error'));
}
function updateStats(){
  const counts={Critical:0,Open:0,'In Progress':0,Resolved:0};
  allComplaints.forEach(c=>{ if(counts[c.status]!==undefined) counts[c.status]++; });
  const cards=document.querySelectorAll('.stat-value');
  if(cards.length>=4){ cards[0].textContent=counts.Critical; cards[1].textContent=counts.Open; cards[2].textContent=counts['In Progress']; cards[3].textContent=counts.Resolved; }
}
function filterComplaints(){
  const f=document.getElementById('cmpFilter').value;
  renderComplaints(f?allComplaints.filter(c=>c.status===f):allComplaints);
}
function resolveComplaint(id){
  if(!confirm('Mark this complaint as resolved?')) return;
  apiPost('?module=complaints&action=resolve',{id}).then(()=>{ showToast('Complaint resolved','success'); loadComplaints(); }).catch(err=>showToast(err.message||'Failed to resolve','error'));
}
function viewComplaint(id){
  apiGet('?module=complaints&action=get&id='+id).then(res=>{
    const c=res.data;
    showToast(`${c.ticket_no}: ${c.subject} — ${c.description}`,'info');
  }).catch(err=>showToast(err.message||'Failed to load','error'));
}
document.addEventListener('DOMContentLoaded',()=>{ Auth.requireRole(['admin']); loadComplaints(); });
</script>
  <script src="../js/app_theme.js"></script>
</body>
</html>
