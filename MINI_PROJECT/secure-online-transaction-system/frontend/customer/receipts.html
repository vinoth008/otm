<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipts | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/css/auth.css" rel="stylesheet">
  <style>
    .dash-body { background: linear-gradient(135deg, #0f172a, #111827); min-height: 100vh; color: #fff; }
    .glass { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(16px); border-radius: 20px; }
    .form-control, .form-select { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; }
    .form-control:focus, .form-select:focus { background: rgba(255,255,255,0.12); color: #fff; border-color: #f59e0b; box-shadow: none; }
    .form-control::placeholder { color: #94a3b8; }
    .form-select option { background: #1e293b; color: #fff; }
  </style>
</head>
<body class="dash-body">
  <nav class="navbar navbar-dark border-bottom border-light border-opacity-10 px-4">
    <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fa-solid fa-receipt me-2"></i>Receipts</a>
    <div class="ms-auto"><a href="dashboard.html" class="btn btn-outline-light btn-sm">Back</a></div>
  </nav>

  <main class="container-fluid p-4">
    <div class="row g-4 mb-4">
      <div class="col-md-3"><div class="glass p-3"><div class="text-secondary">Total Receipts</div><h3 class="mb-0" id="statTotal">0</h3></div></div>
      <div class="col-md-3"><div class="glass p-3"><div class="text-secondary">This Month</div><h3 class="mb-0" id="statMonth">₹ 0</h3></div></div>
      <div class="col-md-3"><div class="glass p-3"><div class="text-secondary">Completed</div><h3 class="mb-0" id="statCompleted">0</h3></div></div>
      <div class="col-md-3"><div class="glass p-3"><div class="text-secondary">Pending</div><h3 class="mb-0" id="statPending">0</h3></div></div>
    </div>

    <div class="glass p-4 mb-4">
      <div class="row g-3">
        <div class="col-md-4"><input class="form-control" id="searchInput" placeholder="Search receipt..."></div>
        <div class="col-md-3">
          <select class="form-select" id="typeFilter">
            <option value="">All Types</option>
            <option value="INCOME">Income</option>
            <option value="EXPENSE">Expense</option>
            <option value="TRANSFER">Transfer</option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="date" class="form-control" id="dateFilter">
        </div>
        <div class="col-md-2">
          <button class="btn btn-outline-light w-100" onclick="loadReceipts()">Filter</button>
        </div>
      </div>
    </div>

    <div class="glass p-4">
      <div class="table-responsive">
        <table class="table table-dark align-middle mb-0">
          <thead>
            <tr><th>Receipt No</th><th>Type</th><th>Reference</th><th>Amount</th><th>Date</th><th>Status</th><th>Action</th></tr>
          </thead>
          <tbody id="receiptsBody">
            <tr><td colspan="7" class="text-center text-secondary">Loading receipts...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    function fmtINR(amount) {
      return '₹ ' + Number(amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function statusBadge(status) {
      const map = { 'COMPLETED': 'success', 'SUCCESS': 'success', 'PENDING': 'warning', 'FAILED': 'danger', 'FAIL': 'danger' };
      return `<span class="badge text-bg-${map[status] || 'secondary'}">${status || 'Unknown'}</span>`;
    }

    async function loadReceipts() {
      const search = document.getElementById('searchInput').value.trim();
      const type = document.getElementById('typeFilter').value;
      const date = document.getElementById('dateFilter').value;
      const params = new URLSearchParams({ module: 'transactions', action: 'get_all', limit: 100 });
      if (search) params.set('search', search);
      if (type) params.set('type', type);
      if (date) params.set('date', date);
      try {
        const res = await apiGet('?' + params.toString());
        const txns = res.data.transactions || res.data || [];
        const tbody = document.getElementById('receiptsBody');
        if (!txns.length) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center text-secondary">No receipts found</td></tr>';
        } else {
          tbody.innerHTML = txns.map((t, i) => `
            <tr>
              <td>RCPT${String(i + 1).padStart(3, '0')}</td>
              <td>${t.type || t.transaction_type || 'N/A'}</td>
              <td>${t.reference || t.transaction_id || t._id || 'N/A'}</td>
              <td>${fmtINR(t.amount)}</td>
              <td>${t.date || t.created_at || 'N/A'}</td>
              <td>${statusBadge(t.status)}</td>
              <td><button class="btn btn-sm btn-outline-light" onclick="openReceipt('${t._id}')">View</button></td>
            </tr>`).join('');
        }
        loadSummary(txns);
      } catch (err) {
        document.getElementById('receiptsBody').innerHTML = '<tr><td colspan="7" class="text-center text-secondary">Failed to load receipts</td></tr>';
      }
    }

    function loadSummary(txns) {
      const now = new Date();
      const month = now.getMonth();
      const year = now.getFullYear();
      const monthTxns = txns.filter(t => {
        const d = new Date(t.created_at || t.date || now);
        return d.getMonth() === month && d.getFullYear() === year;
      });
      const monthTotal = monthTxns.reduce((s, t) => s + Number(t.amount || 0), 0);
      const completed = txns.filter(t => ['COMPLETED', 'SUCCESS'].includes(t.status)).length;
      const pending = txns.filter(t => ['PENDING'].includes(t.status)).length;
      document.getElementById('statTotal').textContent = txns.length;
      document.getElementById('statMonth').textContent = fmtINR(monthTotal);
      document.getElementById('statCompleted').textContent = completed;
      document.getElementById('statPending').textContent = pending;
    }

    async function openReceipt(id) {
      try {
        const res = await apiGet('?module=transactions&action=get&id=' + id);
        const t = res.data;
        const html = `
          <div class="text-start">
            <p><strong>Transaction ID:</strong> ${t.transaction_id || t._id || 'N/A'}</p>
            <p><strong>Type:</strong> ${t.type || t.transaction_type || 'N/A'}</p>
            <p><strong>Amount:</strong> ${fmtINR(t.amount)}</p>
            <p><strong>Status:</strong> ${t.status || 'N/A'}</p>
            <p><strong>Date:</strong> ${t.created_at || t.date || 'N/A'}</p>
            <p><strong>Description:</strong> ${t.description || t.party || 'N/A'}</p>
          </div>`;
        Swal.fire({ icon: 'info', title: 'Receipt Details', html, showCloseButton: true });
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to load receipt' });
      }
    }

    document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') loadReceipts(); });
    document.addEventListener('DOMContentLoaded', loadReceipts);
  </script>
</body>
</html>
