<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/css/auth.css" rel="stylesheet">
  <style>
    .dash-body { background: linear-gradient(135deg, #0f172a, #111827); min-height: 100vh; color: #fff; }
    .glass { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(16px); border-radius: 20px; }
    .form-control, .form-select { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; }
    .form-control:focus, .form-select:focus { background: rgba(255,255,255,0.12); color: #fff; border-color: #f59e0b; box-shadow: none; }
    .form-select option { background: #1e293b; color: #fff; }
    .list-group-item { background: transparent; color: #fff; border-color: rgba(255,255,255,0.12); cursor: pointer; }
    .list-group-item.active, .list-group-item:hover { background: rgba(255,255,255,0.12); color: #f59e0b; border-color: rgba(255,255,255,0.2); }
  </style>
</head>
<body class="dash-body">
  <nav class="navbar navbar-dark border-bottom border-light border-opacity-10 px-4">
    <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fa-solid fa-gear me-2"></i>Settings</a>
    <div class="ms-auto"><a href="dashboard.html" class="btn btn-outline-light btn-sm">Back</a></div>
  </nav>

  <main class="container-fluid p-4">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="glass p-4">
          <h5 class="mb-3">Settings Menu</h5>
          <div class="list-group" id="settingsMenu">
            <button class="list-group-item list-group-item-action active" data-tab="account">Account</button>
            <button class="list-group-item list-group-item-action" data-tab="security">Security</button>
            <button class="list-group-item list-group-item-action" data-tab="notifications">Notifications</button>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div id="tab-account" class="glass p-4 tab-pane">
          <h5 class="mb-4">Account Settings</h5>
          <form id="accountForm" class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Language</label>
              <select class="form-select" id="language">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="mr">Marathi</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Timezone</label>
              <select class="form-select" id="timezone">
                <option value="Asia/Kolkata">Asia/Kolkata (IST)</option>
                <option value="UTC">UTC</option>
                <option value="Asia/Dubai">Asia/Dubai</option>
                <option value="Asia/Singapore">Asia/Singapore</option>
                <option value="America/New_York">America/New_York</option>
                <option value="Europe/London">Europe/London</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Currency</label>
              <select class="form-select" id="currency">
                <option value="INR">INR (₹)</option>
                <option value="USD">USD ($)</option>
                <option value="EUR">EUR (€)</option>
                <option value="GBP">GBP (£)</option>
                <option value="AED">AED (د.إ)</option>
                <option value="SGD">SGD (S$)</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Theme</label>
              <select class="form-select" id="theme">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
              </select>
            </div>
            <div class="col-12">
              <button class="btn btn-primary" type="submit">Save Settings</button>
            </div>
          </form>
        </div>

        <div id="tab-security" class="glass p-4 tab-pane d-none">
          <h5 class="mb-3">Security Controls</h5>
          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-outline-light" onclick="openChangePassword()">Change Password</button>
          </div>
        </div>

        <div id="tab-notifications" class="glass p-4 tab-pane d-none">
          <h5 class="mb-3">Notification Preferences</h5>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="budget_alerts">
            <label class="form-check-label" for="budget_alerts">Budget alerts</label>
          </div>
          <div class="form-check form-switch mt-2">
            <input class="form-check-input" type="checkbox" id="transaction_alerts">
            <label class="form-check-label" for="transaction_alerts">Transaction alerts</label>
          </div>
          <div class="form-check form-switch mt-2">
            <input class="form-check-input" type="checkbox" id="security_alerts">
            <label class="form-check-label" for="security_alerts">Security alerts</label>
          </div>
          <div class="form-check form-switch mt-2">
            <input class="form-check-input" type="checkbox" id="admin_announcements">
            <label class="form-check-label" for="admin_announcements">Admin announcements</label>
          </div>
          <button class="btn btn-primary mt-3" onclick="saveNotificationPrefs()">Save Preferences</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    async function loadSettings() {
      try {
        const res = await apiGet('?module=settings&action=get');
        const s = res.data;
        document.getElementById('language').value = s.language || 'en';
        document.getElementById('timezone').value = s.timezone || 'Asia/Kolkata';
        document.getElementById('currency').value = s.currency || 'INR';
        document.getElementById('theme').value = s.theme_preference || 'dark';
        const prefs = s.notification_prefs || {};
        document.getElementById('budget_alerts').checked = prefs.budget_alerts !== false;
        document.getElementById('transaction_alerts').checked = prefs.transaction_alerts !== false;
        document.getElementById('security_alerts').checked = prefs.security_alerts !== false;
        document.getElementById('admin_announcements').checked = prefs.admin_announcements !== false;
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to load settings' });
      }
    }

    document.getElementById('accountForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await apiPost('?module=settings&action=update', {
          currency: document.getElementById('currency').value,
          language: document.getElementById('language').value,
          timezone: document.getElementById('timezone').value
        });
        await apiPost('?module=settings&action=update_theme', { theme: document.getElementById('theme').value });
        Swal.fire({ icon: 'success', title: 'Saved', text: res.message || 'Settings updated successfully.' });
        loadSettings();
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to save settings' });
      }
    });

    async function saveNotificationPrefs() {
      try {
        const res = await apiPost('?module=settings&action=update_notifications', {
          budget_alerts: document.getElementById('budget_alerts').checked,
          transaction_alerts: document.getElementById('transaction_alerts').checked,
          security_alerts: document.getElementById('security_alerts').checked,
          admin_announcements: document.getElementById('admin_announcements').checked
        });
        Swal.fire({ icon: 'success', title: 'Saved', text: res.message || 'Notification preferences updated.' });
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to save preferences' });
      }
    }

    function openChangePassword() {
      Swal.fire({
        title: 'Change Password',
        html: `
          <input type="password" id="swal-current" class="swal2-input" placeholder="Current Password">
          <input type="password" id="swal-new" class="swal2-input" placeholder="New Password (min 8 chars)">
          <input type="password" id="swal-confirm" class="swal2-input" placeholder="Confirm New Password">
        `,
        showCancelButton: true,
        confirmButtonText: 'Change Password',
        preConfirm: async () => {
          const current = document.getElementById('swal-current').value;
          const newPass = document.getElementById('swal-new').value;
          const confirm = document.getElementById('swal-confirm').value;
          if (!current || !newPass || !confirm) {
            Swal.showValidationMessage('All fields are required');
            return false;
          }
          if (newPass !== confirm) {
            Swal.showValidationMessage('New passwords do not match');
            return false;
          }
          try {
            return await apiPost('?module=profile&action=change_password', {
              current_password: current,
              new_password: newPass,
              confirm_password: confirm
            });
          } catch (err) {
            Swal.showValidationMessage(err.message || 'Failed to change password');
            return false;
          }
        }
      }).then(result => {
        if (result.isConfirmed) {
          Swal.fire({ icon: 'success', title: 'Password Changed', text: result.value.message || 'Password changed successfully.' });
        }
      });
    }

    document.getElementById('settingsMenu').addEventListener('click', (e) => {
      if (!e.target.classList.contains('list-group-item')) return;
      document.querySelectorAll('#settingsMenu .list-group-item').forEach(el => el.classList.remove('active'));
      e.target.classList.add('active');
      const tab = e.target.dataset.tab;
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.add('d-none'));
      document.getElementById('tab-' + tab).classList.remove('d-none');
    });

    document.addEventListener('DOMContentLoaded', loadSettings);
  </script>
</body>
</html>
