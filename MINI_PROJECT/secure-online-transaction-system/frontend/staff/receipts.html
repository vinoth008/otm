<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Receipts | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/css/auth.css" rel="stylesheet">
  <style>.dash-body{background:#0f172a;min-height:100vh;color:#fff}.glass{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(16px);border-radius:20px}</style>
</head>
<body class="dash-body">
  <main class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="mb-0"><i class="fa-solid fa-receipt me-2"></i>Receipts</h3>
      <div>
        <button class="btn btn-outline-light me-2" onclick="printAll()">Print Batch</button>
        <a class="btn btn-outline-light" href="dashboard.html"><i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard</a>
      </div>
    </div>

    <div class="glass p-4 mb-4">
      <div class="row g-3">
        <div class="col-md-4"><input class="form-control" id="searchInput" placeholder="Search receipt..."></div>
        <div class="col-md-3"><select class="form-select" id="typeFilter"><option value="">All Types</option><option value="income">Income</option><option value="expense">Expense</option><option value="transfer">Transfer</option></select></div>
        <div class="col-md-3"><input type="date" class="form-control" id="dateFilter"></div>
        <div class="col-md-2"><button class="btn btn-outline-light w-100" onclick="loadReceipts()">Filter</button></div>
      </div>
    </div>

    <div class="glass p-4">
      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle mb-0">
          <thead><tr><th>Receipt No</th><th>Customer</th><th>Type</th><th>Amount</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="receiptsBody">
            <tr><td colspan="7" class="text-center text-muted">Loading receipts...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    function fmtINR(amount) {
      return '₹ ' + Number(amount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function statusBadge(status) {
      const map = { 'COMPLETED': 'success', 'SUCCESS': 'success', 'PENDING': 'warning', 'FAILED': 'danger', 'FAIL': 'danger' };
      return `<span class="badge text-bg-${map[status] || 'secondary'}">${status || 'Unknown'}</span>`;
    }

    async function loadReceipts() {
      const search = document.getElementById('searchInput').value.trim();
      const type = document.getElementById('typeFilter').value;
      const date = document.getElementById('dateFilter').value;
      const params = new URLSearchParams({ module: 'transactions', action: 'admin_all', limit: 100 });
      if (search) params.set('search', search);
      if (type) params.set('type', type);
      if (date) params.set('date_from', date);
      try {
        const res = await apiGet('?' + params.toString());
        const txns = res.data.transactions || [];
        const tbody = document.getElementById('receiptsBody');
        if (!txns.length) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No receipts found</td></tr>';
        } else {
          tbody.innerHTML = txns.map((t, i) => `
            <tr>
              <td>RCPT${String(i + 1).padStart(3, '0')}</td>
              <td>${t.user_name || 'Unknown'}</td>
              <td>${t.type || 'N/A'}</td>
              <td>${fmtINR(t.amount)}</td>
              <td>${t.date || t.created_at || 'N/A'}</td>
              <td>${statusBadge(t.status)}</td>
              <td><button class="btn btn-sm btn-outline-light" onclick="openReceipt('${t.transaction_id}')">View</button></td>
            </tr>`).join('');
        }
      } catch (err) {
        document.getElementById('receiptsBody').innerHTML = '<tr><td colspan="7" class="text-center text-muted">Failed to load receipts</td></tr>';
      }
    }

    async function openReceipt(id) {
      try {
        const res = await apiGet('?module=transactions&action=get&id=' + id);
        const t = res.data;
        const html = `
          <div class="text-start">
            <p><strong>Transaction ID:</strong> ${t.transaction_id || t._id || 'N/A'}</p>
            <p><strong>Type:</strong> ${t.type || 'N/A'}</p>
            <p><strong>Amount:</strong> ${fmtINR(t.amount)}</p>
            <p><strong>Status:</strong> ${t.status || 'N/A'}</p>
            <p><strong>Date:</strong> ${t.created_at || t.date || 'N/A'}</p>
            <p><strong>Description:</strong> ${t.description || 'N/A'}</p>
          </div>`;
        Swal.fire({ icon: 'info', title: 'Receipt Details', html, showCloseButton: true });
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.message || 'Failed to load receipt' });
      }
    }

    function printAll() {
      window.print();
    }

    document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') loadReceipts(); });
    document.getElementById('typeFilter').addEventListener('change', loadReceipts);
    document.getElementById('dateFilter').addEventListener('change', loadReceipts);
    loadReceipts();
  </script>
</body>
</html>
