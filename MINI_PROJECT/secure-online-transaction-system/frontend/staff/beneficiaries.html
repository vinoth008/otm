<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beneficiaries | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/css/auth.css" rel="stylesheet">
  <style>.dash-body{background:#0f172a;min-height:100vh;color:#fff}.glass{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(16px);border-radius:20px}</style>
</head>
<body class="dash-body">
  <main class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="mb-0"><i class="fa-solid fa-address-book me-2"></i>Beneficiaries</h3>
      <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#beneModal">Add Beneficiary</button>
    </div>

    <div class="glass p-4">
      <div class="table-responsive">
        <table class="table table-dark table-hover align-middle mb-0">
          <thead><tr><th>Name</th><th>Bank</th><th>Account</th><th>IFSC</th><th>Action</th></tr></thead>
          <tbody>
            <tr><td>Asha</td><td>HDFC</td><td>****1234</td><td>HDFC0001</td><td><button class="btn btn-sm btn-outline-light" onclick="editBene('Asha')">Edit</button></td></tr>
            <tr><td>Rahul</td><td>SBI</td><td>****5678</td><td>SBIN0002</td><td><button class="btn btn-sm btn-outline-light" onclick="editBene('Rahul')">Edit</button></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal fade" id="beneModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header"><h5 class="modal-title" id="beneTitle">Add Beneficiary</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <form class="row g-3">
            <div class="col-md-6"><input class="form-control" placeholder="Name"></div>
            <div class="col-md-6"><input class="form-control" placeholder="Bank Name"></div>
            <div class="col-md-6"><input class="form-control" placeholder="Account Number"></div>
            <div class="col-md-6"><input class="form-control" placeholder="IFSC"></div>
          </form>
        </div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button><button class="btn btn-success">Save</button></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    function editBene(name){document.getElementById('beneTitle').textContent='Edit '+name;new bootstrap.Modal(document.getElementById('beneModal')).show();}
  </script>
</body>
</html>
