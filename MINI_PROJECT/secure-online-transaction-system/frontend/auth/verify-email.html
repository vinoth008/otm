<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email | Secure Transaction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  <link href="../assets/css/auth.css" rel="stylesheet">
</head>
<body class="auth-body d-flex align-items-center">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="auth-card p-4 p-md-5 text-white">
          <div class="text-center mb-4">
            <div class="display-6 mb-2"><i class="fa-solid fa-envelope-circle-check"></i></div>
            <h3 class="auth-brand">Verify Email</h3>
            <p class="text-light-emphasis">Enter the verification token from your email</p>
          </div>

          <form id="verifyEmailForm">
            <input type="hidden" id="user_id">

            <div class="mb-3">
              <label class="form-label">Verification Token</label>
              <input type="text" class="form-control" id="token" placeholder="Paste your token here" required>
            </div>

            <button class="btn btn-success w-100 py-2" type="submit">
              <i class="fa-solid fa-check-circle me-2"></i>Verify Email
            </button>
          </form>

          <div class="d-flex justify-content-between mt-4">
            <a href="login.html" class="auth-link">Back to login</a>
            <button class="btn btn-link auth-link p-0" id="resendBtn" type="button">Resend verification</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('user_id').value = params.get('uid') || '';
    const autoToken = params.get('token');
    if (autoToken) document.getElementById('token').value = autoToken;

    document.getElementById('verifyEmailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = await postJSON(`${API_BASE}/verify_email.php`, {
          user_id: document.getElementById('user_id').value,
          token: document.getElementById('token').value.trim()
        });

        if (!data.success) return showError(data.message);

        await Swal.fire({
          icon: 'success',
          title: 'Email Verified',
          text: 'Your email address has been verified successfully.',
          confirmButtonText: 'Continue'
        });

        location.href = 'login.html';
      } catch (err) {
        showError('Unable to connect to server');
      }
    });

    document.getElementById('resendBtn').addEventListener('click', async () => {
      const uid = document.getElementById('user_id').value;
      if (!uid) return showError('Missing user id');
      try {
        const data = await postJSON(`${API_BASE}/resend_email_verification.php`, { user_id: uid });
        if (!data.success) return showError(data.message);
        await Swal.fire({
          icon: 'success',
          title: 'Verification Link Generated',
          html: data.data?.verify_link ? `<a href="${data.data.verify_link}" target="_blank">Open verification link</a>` : 'A new verification link has been generated.',
          confirmButtonText: 'OK'
        });
      } catch (err) {
        showError('Unable to resend verification');
      }
    });
  </script>
</body>
</html>
