<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Verification — SecureSOT</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/auth.css" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon"><i class="fa-solid fa-mobile-screen"></i></div>
      <h2>OTP Verification</h2>
      <p>Enter the 6-digit code sent to your email</p>
    </div>
    <form id="otp-form">
      <div class="otp-grid">
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
        <input type="text" class="otp-input" maxlength="1" inputmode="numeric" />
      </div>
      <p style="text-align:center;font-size:0.82rem;color:var(--text-muted);margin-bottom:20px;">Demo OTP: <b style="color:var(--primary-light)">1 2 3 4 5 6</b></p>
      <button type="submit" class="btn-auth"><i class="fa-solid fa-shield-check"></i> Verify OTP</button>
    </form>
    <div class="auth-footer">Didn't receive? <a href="#" onclick="showToast('OTP resent!','success')">Resend OTP</a></div>
  </div>
</div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
